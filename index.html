*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--fundo);scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top) + 12px)}

[hidden]{display:none!important}

main{display:block;padding:8px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 36px);outline:none}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:100%;max-width:var(--max);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--folha);border-top:1px solid var(--linha)}

<script type="application/json" id="data-guide">{"meta":{"title":"Guia de comunicação • Letícia Alves","hero_kicker":"Letícia Alves · Manual de execução · 16 outubro 2026","hero_title":"Comunicação clara para uma prática acolhedora","hero_text":"Posicionamento, Google, conteúdo e aquisição para o atendimento de mulheres e pessoas LGBT+. Um guia para usar no Canva, na rotina e em novos chats.","footer":"Material de planejamento. Revisão e publicação sob responsabilidade profissional da Letícia.","txt_header":"PROMPTS DE CONTEÚDO • LETÍCIA ALVES\nVersão 1 • 16/10/2026\n\nComo usar: copie o bloco inteiro de uma pauta e cole em um chat novo. Cada bloco repete o contexto. A profissional deve revisar conteúdo e identificação. Não envie dados de pacientes."},"chapters":[{"id":"inicio","label":"Manual • 01","title":"Comece por estas decisões","blocks":[{"t":"p","text":"Este manual transforma o posicionamento de Letícia Alves em uma rotina de comunicação para Instagram, Perfil da Empresa no Google e anúncios. O objetivo é gerar procura compatível com a prática clínica e com a agenda, usando conteúdo compreensível, acolhedor e verificável."},{"t":"note","text":"Decisão recomendada: posicionamento explícito para mulheres e pessoas LGBT+, com uma marca única e conteúdos que alternam vivências específicas e dúvidas sobre o atendimento. Seguidores são um indicador secundário; a medida principal é a procura adequada que chega à primeira sessão."},{"t":"table","head":["Abordagem","Benefício","Limitação"],"rows":[["Perfil generalista","Permite falar de muitas demandas.","Diferencia pouco; o público precisa descobrir sozinho se será acolhido."],["Duas contas separadas","Permite campanhas e tons distintos.","Duplica produção e gestão; fragmenta uma operação individual."],["Uma conta com foco explícito","Une clareza, consistência e uma rotina viável.","Exige mostrar as duas frentes continuamente, inclusive fora de datas comemorativas."]]},{"t":"h3","text":"Use o material nesta ordem"},{"t":"ul","items":["Hoje: revise a identificação profissional, substitua bio e descrição e teste o caminho de contato.","Nesta semana: prepare os três posts fixados e os modelos de Canva; corrija os cadastros antigos.","Nas próximas oito semanas: siga o calendário, registre procura e ajuste uma variável por vez."]},{"t":"p","text":"Navegação: os capítulos têm links no sumário. No guia HTML, use a busca, os filtros do calendário e os botões de copiar. Cada pauta tem um prompt completo que funciona em um chat novo. O arquivo de prompts também pode ser usado sem o guia aberto."},{"t":"note","text":"Suposições de trabalho: foco de aquisição em pessoas adultas; atendimento presencial em Campo Grande/MS e online, como no print; rotina inicial de 3 horas semanais. Verba, honorários, vagas, duração das sessões e formações concluídas não foram informados. Os textos não inventam esses dados."}]},{"id":"auditoria","label":"Manual • 02","title":"Diagnóstico do caso","blocks":[{"t":"table","head":["Evidência observada","Leitura","Ação"],"rows":[["Nome do Instagram já cita mulheres e LGBT+.","O recorte existe; falta sustentá-lo na bio e nas pautas.","Manter a intenção e explicitar quem é atendido e como."],["Bio diz 'Te ajudo a se tornar sua melhor versão'.","É genérica e pode soar como cobrança por desempenho.","Trocar por serviço, público, local/modalidade e próximo passo."],["10 posts e 1.873 seguidores no print.","É um retrato pontual, sem dados de alcance ou origem.","Não inferir engajamento, qualidade de seguidores ou conversão."],["Capas com fotos quentes, textos pequenos e estilos variados.","Há personalidade visual, mas a leitura no celular oscila.","Preservar calor visual; padronizar tamanho, contraste e famílias de capas."],["Destaques identificados principalmente por emojis.","A navegação exige interpretação.","Nomear 'Comece aqui', 'Terapia', 'Dúvidas', 'Consultório' e 'Contato'."],["Descrição do Google começa por três campos de formação.","As credenciais ocupam o espaço do posicionamento.","Abrir com psicoterapia e público; explicar formação em área própria."]]},{"t":"h3","text":"O que os prints permitem e não permitem concluir"},{"t":"p","text":"O Google exibe 5,0 e 14 avaliações no material enviado. Não foi feita auditoria dessas avaliações, dos seus autores ou das interações. O contador de 233 interações no painel não identifica, no print, período nem quantas viraram consultas. Portanto, não serve como linha de base de aquisição."},{"t":"p","text":"O Instagram ao vivo não foi acessível pela pesquisa automatizada. A auditoria visual usou os três prints, e a pesquisa de mercado usou páginas públicas. Não foram inspecionados Insights, campanhas, orçamento, mensagens, prontuários ou o painel de administração da empresa."},{"t":"note","text":"Prioridade: clareza e percurso até o contato antes de ampliar produção ou anúncios. O print não mostra um link de agendamento evidente na bio. Isso precisa ser verificado no aplicativo, sem presumir que o recurso esteja ausente."}]},{"id":"mercado","label":"Manual • 03","title":"Mercado e comparação de referências","blocks":[{"t":"p","text":"Pesquisa exploratória realizada em 16/10/2026: buscas pelo nome e identificador da Letícia, psicoterapia para mulheres em Campo Grande/MS e atendimento LGBT+ online. A amostra abaixo mostra alternativas visíveis, sem representar todo o mercado, a ordem do Google Maps ou a qualidade clínica."},{"t":"table","head":["Referência pública","O que comunica","Aprendizado aplicável"],"rows":[["Danielli Lopes • Campo Grande [9]","Público feminino, relações, atendimento online e presencial, contato e perguntas frequentes.","Nomear o público logo na abertura e responder dúvidas de contratação."],["Luiza Barros • Campo Grande [10]","Mulheres, TCC, dificuldades concretas e explicação da primeira sessão.","Traduzir abordagem em experiência de atendimento, sem listar apenas siglas."],["Central Terapia • online [11]","Página dedicada à população LGBTQIAPN+ com perfis e contato direto.","No online, a concorrência inclui plataformas com muitas opções."],["Rede Psicólogos • online [12]","Busca temática LGBT+ com diferentes profissionais e formações.","Declarar o público ajuda a escolha, mas precisa de detalhes do serviço."]]},{"t":"h3","text":"Oportunidade formulada como hipótese"},{"t":"p","text":"Uma profissional local reconhecível, com comunicação afirmativa e instruções simples para começar, pode reduzir incertezas de quem procura acolhimento. A hipótese a testar é que conteúdos sobre situações específicas e sobre o funcionamento da terapia gerem mais procura compatível do que frases motivacionais genéricas. Não há evidência suficiente para chamar o nicho local de pouco concorrido."},{"t":"p","text":"Contexto de necessidade não equivale a mercado pagante. A PNS 2019 estimou diagnóstico referido de depressão em 14,7% das mulheres adultas e 5,1% dos homens adultos. São dados nacionais e históricos, não prevalência atual de Campo Grande, número de clientes potenciais ou disposição a pagar. [13]"},{"t":"h3","text":"Dados comerciais que ainda precisam ser medidos"},{"t":"ul","items":["Planejador de palavras-chave: pesquisar Campo Grande/MS e Brasil separadamente; registrar faixas de volume, concorrência e estimativas de lance com data e local.","Procura real: perguntar de onde a pessoa chegou, modalidade e compatibilidade de horários, sem investigar identidade para fins de marketing.","Capacidade e viabilidade: vagas recorrentes, honorários, custos e tributos. Sem esses dados não existe previsão confiável de aquisição ou retorno."]},{"t":"p","text":"Não foram obtidos CPC, CPM, volume de buscas, alcance local, participação de mercado ou taxas de conversão da clínica. Não usar estimativas de plataformas como se fossem resultados garantidos."}]},{"id":"posicionamento","label":"Manual • 04","title":"Posicionamento e linguagem","blocks":[{"t":"copy","text":"Psicoterapia para mulheres e pessoas LGBT+, com escuta acolhedora e respeito à história, à identidade e ao contexto de cada pessoa. Atendimento presencial em Campo Grande/MS e online."},{"t":"p","text":"Este é o eixo da comunicação. Ele apresenta serviço, público, forma de cuidado e acesso. Não pressupõe que todas as pessoas atendidas tenham as mesmas demandas e não transforma identidade em diagnóstico."},{"t":"table","head":["Grupo editorial","Situação a abordar","Pergunta que o conteúdo deve responder"],"rows":[["Mulheres adultas","Autocobrança, limites, descanso, relações e escolhas.","Como minha experiência pode ser compreendida sem mais cobrança?"],["Pessoas LGBT+ adultas","Pertencimento, vínculos, privacidade, identidade, autonomia e alegria.","Minha identidade será respeitada sem virar o único tema da terapia?"],["Interseção e processo","Mulheres LGBT+, primeira sessão, sigilo e modalidades.","Como é começar e como posso tirar dúvidas com privacidade?"]]},{"t":"note","text":"Mulheres e pessoas LGBT+ são grupos que se sobrepõem. Mulheres trans são mulheres. Evite escrever como se 'mulheres' significasse apenas mulheres cis ou como se toda pessoa LGBT+ precisasse discutir sexualidade."},{"t":"h3","text":"Regras da voz"},{"t":"ul","items":["Escreva uma ideia por peça. Comece por uma situação reconhecível e acrescente uma explicação que ajude a pensar.","Use 'pode', 'em alguns contextos' e exemplos ilustrativos quando a experiência varia. Não faça diagnósticos à distância.","Use 'pessoas LGBT+' em conteúdos gerais e nomeie grupos específicos quando a pauta exigir precisão.","Fale de autonomia, recursos e contexto; inclua alegria, cotidiano e vínculos, além de sofrimento e preconceito."]},{"t":"table","head":["Trocar","Por"],"rows":[["Sua melhor versão","Compreender sua história e suas possibilidades de escolha."],["Você se sabota","O que torna essa escolha difícil neste contexto?"],["Cure sua ansiedade","Conheça como funciona o acompanhamento psicológico."],["Assuma quem você é","Você pode decidir o que compartilhar, com quem e quando."],["Conte sua história nos comentários","Salve para consultar; dúvidas sobre o atendimento podem ser enviadas em privado."]]},{"t":"p","text":"A postura afirmativa deve aparecer também no cuidado: nome e pronome respeitados, linguagem inclusiva, ausência de pressupostos sobre parceiros e compreensão do contexto. As referências do CFP rejeitam a patologização das homossexualidades e das identidades trans. [15][16]"}]},{"id":"textos","label":"Manual • 05","title":"Textos para os perfis","blocks":[{"t":"h3","text":"Descrição recomendada para o Google"},{"t":"copy","text":"Sou Letícia Alves, psicóloga clínica, CRP 14/11055. Ofereço psicoterapia com foco no atendimento de mulheres e pessoas LGBT+, com escuta acolhedora e respeito à diversidade de histórias, identidades e formas de se relacionar. Atendo demandas como ansiedade, autoestima, autocobrança e dificuldades nos relacionamentos afetivos e familiares. O cuidado é individualizado e considera a história e o contexto de cada pessoa. Atendimento presencial em Campo Grande/MS e online, mediante agendamento. Entre em contato para conhecer o funcionamento da psicoterapia e consultar a disponibilidade de horários."},{"t":"p","text":"Texto com 600 caracteres, incluindo espaços. O Google permite até 750 e orienta não inserir URLs ou HTML no campo. [4]"},{"t":"h3","text":"Nome e bio do Instagram"},{"t":"copy","text":"Letícia Alves | Psicóloga de Mulheres e LGBT+"},{"t":"copy","text":"CRP 14/11055\nPsicoterapia para mulheres e pessoas LGBT+\nPresencial em Campo Grande/MS e online\nInformações e agendamento ↓"},{"t":"p","text":"A bio tem 122 caracteres. O nome acima mantém o recorte já usado no print. Na identificação profissional da conta e das peças, utilize o nome completo ou nome social profissional, a palavra Psicóloga e o CRP. O texto usa 'Letícia Alves' e CRP 14/11055 conforme o material fornecido; confirme se o nome está completo e o registro está ativo antes de publicar. [1]"},{"t":"h3","text":"Link de contato"},{"t":"copy","text":"https://wa.me/5567991810336?text=Ol%C3%A1%2C%20vim%20pelo%20Instagram%20e%20gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20psicoterapia."},{"t":"p","text":"O número foi transcrito do print: (67) 99181-0336. Antes de colocar o link na bio, teste se abre o contato correto. A mensagem pronta informa apenas a origem e o interesse pelo serviço, sem pedir exposição de orientação sexual ou de sintomas."},{"t":"note","text":"Formação: a descrição original não comprova quais cursos foram concluídos. Por isso, o texto recomendado não anuncia especialização em Neuropsicologia, TCC ou ACP. Registre a situação real de cada formação em uma ficha interna e descreva cursos concluídos e cursos em andamento de forma distinta. Não confunda abordagem teórica com título profissional de especialista. [1][2]"},{"t":"p","text":"Adolescentes aparecem na descrição antiga, mas não foram definidos como foco da nova aquisição. A versão recomendada não afirma que ela deixou de atendê-los: apenas não faz dessa faixa etária o eixo da campanha. Se esse atendimento continuar, explique critérios e contato com responsáveis em uma página específica, revisada pela profissional."}]},{"id":"google","label":"Manual • 06","title":"Google e a confusão com outra Letícia","blocks":[{"t":"note","text":"No print, @leticia_alves_psicologa aparece em um resultado orgânico do Instagram à esquerda. A ficha empresarial está à direita. Isso não demonstra que a outra conta esteja cadastrada como rede social da empresa."},{"t":"h3","text":"Trilha 1 • Conferir os links da ficha"},{"t":"ul","items":["Entre na conta proprietária e pesquise a empresa. Abra Editar perfil, Contato e Perfis sociais, se o campo estiver disponível.","Cadastre https://www.instagram.com/psi.leticia_alves/ como Instagram. Verifique também o destino do botão Site e de eventuais links de agendamento.","Se houver link social incorreto inserido automaticamente, tente substituí-lo. Se não conseguir removê-lo, use o suporte do Perfil da Empresa. A disponibilidade de campos varia. [3]"]},{"t":"h3","text":"Trilha 2 • Fortalecer a identidade nas buscas"},{"t":"p","text":"A página pública do MundoPsicólogos com CRP 14/11055 e nome Letícia Alves aponta para @psi.lleticiaalves e endereço Pedro Celestino, 2017. O print atual mostra Alexandre Fleming, 873, Vila Bandeirante. São sinais públicos inconsistentes que merecem conferência, sem assumir que um cadastro antigo seja a causa do resultado da homônima. [8]"},{"t":"ul","items":["Se o cadastro for dela e os dados estiverem antigos, atualize Instagram, endereço, nome profissional, contato e modalidades.","Padronize os mesmos dados no site, páginas profissionais e perfis sob controle dela. Use a URL canônica do Instagram, sem encurtador nesse campo.","No Instagram, confira se a conta profissional é pública e se há configuração que permita indexação por buscadores. A existência da opção e a indexação precisam ser verificadas na conta.","Se houver site próprio, crie uma página clara com nome profissional, CRP, local, apresentação e link do Instagram. Peça indexação do site no Search Console quando houver propriedade verificada; não prometa controlar a indexação do Instagram."]},{"t":"h3","text":"Como verificar o avanço"},{"t":"p","text":"Registre a data e faça buscas pelo identificador exato, pelo nome + CRP e pelo nome + Campo Grande em 7, 14 e 30 dias. Compare em contexto semelhante e observe diferenças entre Busca e Maps. Essas datas são janelas de acompanhamento, não prazos de correção prometidos."},{"t":"p","text":"Não denuncie o perfil legítimo da homônima como se fosse falso. Não acrescente palavras-chave ao nome empresarial apenas para ranquear. O Google exige representação fiel ao nome utilizado e considera relevância, distância e destaque na busca local; ninguém pode garantir a primeira posição. [5][6]"}]},{"id":"ficha","label":"Manual • 07","title":"Rotina do Perfil da Empresa","blocks":[{"t":"table","head":["Campo","Implementação","Como conferir"],"rows":[["Nome","Manter o nome real utilizado profissionalmente. Não anexar 'melhor', bairros ou uma lista de serviços.","Conferir consistência com apresentação, site e sinalização."],["Categoria","Usar Psicólogo como principal se for a categoria adequada disponível. Adicionar somente categorias que descrevam serviços efetivos.","Não cadastrar Neuropsicólogo apenas para capturar buscas."],["Endereço e horários","Confirmar Alexandre Fleming, 873 e horários reais; explicar atendimento mediante agendamento.","Testar rota, entrada e eventuais dados de sala."],["Serviços","Cadastrar psicoterapia individual, atendimento presencial e psicoterapia online, quando efetivamente oferecidos.","Descrição curta para cada serviço; nenhuma promessa de cura."],["Fotos","Retrato profissional, sala vazia, entrada e acessibilidade real.","Sem pessoas atendidas, documentos, telas de agenda ou objetos identificáveis."],["Atributos","Usar opções inclusivas e de acessibilidade somente se disponíveis e verdadeiras.","Não usar atributo como selo de competência clínica."],["Contato","Conferir telefone, Instagram, site e link de agendamento.","Pedir a uma pessoa de confiança que percorra o caminho."]]},{"t":"h3","text":"Manutenção enxuta"},{"t":"p","text":"Uma vez por semana, confira alterações sugeridas, horários, links e perguntas públicas. A cada duas semanas, adapte uma pauta do calendário para um texto curto e informativo. Essa cadência é operacional; não há promessa de que publicar com uma frequência específica melhore o ranking."},{"t":"copy","text":"Psicoterapia para mulheres e pessoas LGBT+ em Campo Grande/MS e online. O primeiro contato pode ser usado para conhecer o funcionamento do atendimento, as modalidades e a disponibilidade de horários. Informações pelo contato indicado no perfil."},{"t":"h3","text":"Avaliações e respostas"},{"t":"p","text":"Não transforme avaliações de pacientes em campanha, não ofereça recompensa e não peça relatos de evolução. Evite reproduzir depoimentos ou capturas de comentários em peças promocionais. Uma avaliação espontânea pode existir no Google; a resposta da profissional deve evitar confirmar que alguém foi paciente ou revelar conteúdo clínico. [7]"},{"t":"copy","text":"Agradeço por compartilhar sua percepção. Para preservar a privacidade, não comento atendimentos neste espaço. Informações sobre o serviço podem ser tratadas pelo contato profissional."},{"t":"p","text":"Use a resposta apenas quando couber ao caso. Diante de reclamação, não apresente a história clínica como defesa pública; encaminhe questões administrativas em privado e avalie a necessidade de orientação do CRP."}]},{"id":"conversao","label":"Manual • 08","title":"Do conteúdo ao primeiro atendimento","blocks":[{"t":"p","text":"O percurso precisa responder, em poucos passos: esta profissional atende pessoas como eu, como funciona e por onde tiro dúvidas? O Instagram favorece identificação e vínculo; o Google captura procura por serviço e localização; o contato esclarece condições e permite avaliar compatibilidade."},{"t":"table","head":["Etapa","O que entregar","O que medir"],"rows":[["Descoberta","Reels com situações concretas e posts compartilháveis.","Alcance de não seguidores e visitas ao perfil."],["Confiança","Posts fixados, apresentação, explicação do processo e modalidades.","Visitas, cliques e dúvidas recebidas."],["Contato","Um caminho principal e resposta clara sobre funcionamento.","Novas conversas sobre atendimento."],["Agendamento","Disponibilidade real, honorários, regras e orientação de chegada.","Primeiras sessões agendadas."],["Início","Comparecimento e avaliação clínica da continuidade.","Primeiras sessões realizadas; decisão clínica respeitada."]]},{"t":"h3","text":"Mensagem de entrada"},{"t":"copy","text":"Olá! Sou Letícia Alves, psicóloga. Obrigada pelo contato. Para eu explicar as possibilidades de atendimento, você procura a modalidade online ou presencial em Campo Grande? Se quiser, diga também quais dias ou períodos costumam funcionar para você. Não é necessário contar detalhes pessoais nesta mensagem."},{"t":"h3","text":"Quando perguntarem o valor"},{"t":"copy","text":"Posso te informar os honorários e o funcionamento do atendimento por aqui. Você prefere online ou presencial? Assim verifico a disponibilidade e envio as condições correspondentes."},{"t":"p","text":"Depois, responda de forma direta com os honorários reais e as condições. Não esconda o preço para forçar uma conversa longa. O valor pode ser informado no contato individual; o plano evita preço como chamariz publicitário. Não há honorário inserido neste manual porque ele não foi informado."},{"t":"h3","text":"Pessoa ainda em dúvida"},{"t":"copy","text":"Tudo bem decidir com calma. Se precisar esclarecer alguma questão sobre o funcionamento da psicoterapia, pode me escrever por este contato."},{"t":"h3","text":"Acompanhamento administrativo"},{"t":"p","text":"Se a pessoa pediu retorno ou aceitou receber disponibilidade, envie uma mensagem breve no prazo combinado. Sem essa expectativa, evite sequências insistentes. Não use escassez inventada, pressão emocional, diagnóstico por mensagem ou coleta detalhada de sintomas para qualificar um contato comercial."},{"t":"note","text":"Agenda: defina quantas vagas recorrentes podem ser abertas, incluindo a continuidade do cuidado. Um limite de 'novos pacientes por mês' não substitui a checagem dos horários que continuarão ocupados nas semanas seguintes."}]},{"id":"editorial","label":"Manual • 09","title":"Sistema editorial para oito semanas","blocks":[{"t":"p","text":"A unidade de produção é uma pauta com uma finalidade. O calendário contém 24 peças: 8 voltadas a mulheres, 8 a pessoas LGBT+ e 8 a temas compartilhados ou ao processo. A divisão é uma escolha editorial inicial, não uma estimativa do tamanho dos públicos."},{"t":"table","head":["Pilar","Exemplos","Função"],"rows":[["Vivências de mulheres","Limites, autocobrança, descanso, comparação, relações.","Gerar identificação sem reforçar estereótipos."],["Vivências LGBT+","Privacidade, nome e pronome, pertencimento, alegria, vínculos.","Mostrar respeito contínuo à diversidade."],["Processo e acesso","Primeira sessão, modalidades, sigilo, agendamento.","Reduzir dúvidas e facilitar a procura informada."]]},{"t":"h3","text":"Posts fixados"},{"t":"ul","items":["Quem eu atendo: serviço, mulheres e pessoas LGBT+, local e modalidades.","Como funciona começar: objetivos da primeira conversa e respeito ao ritmo de cada pessoa.","Como pedir informações: contato, o que perguntar e o que não precisa expor."]},{"t":"h3","text":"Estrutura de qualquer peça"},{"t":"p","text":"Gancho concreto → explicação com nuance → um exemplo ilustrativo → uma pergunta de reflexão privada ou orientação geral → um único convite. Evite listas de sintomas que simulem testes, fórmulas de diagnóstico ou frases vagas que poderiam pertencer a qualquer perfil."},{"t":"table","head":["Convite","Quando usar"],"rows":[["Salvar","Informação que será útil consultar novamente."],["Enviar com cuidado","Peça educativa sem pressupor que quem recebe tenha um problema."],["Conhecer o atendimento","Peça sobre processo, modalidades ou apresentação."],["Refletir em privado","Pauta que envolve identidade, relações ou exposição."]]},{"t":"h3","text":"Stories em três blocos semanais"},{"t":"p","text":"Use 3 telas por bloco: contexto simples, explicação curta e indicação do conteúdo ou atendimento. Nas semanas de menor tempo, reaproveite o próprio post. Perguntas devem ser sobre temas e funcionamento, não solicitações de trauma, identidade ou histórico de saúde. Enquetes não são testes clínicos."},{"t":"p","text":"Se surgir relato pessoal, não o republique. Acolha de forma breve, preserve privacidade e explique os limites do canal. Conteúdos sobre violência ou sofrimento intenso exigem revisão profissional e cuidado com segurança; não use medo como gancho de venda."}]},{"id":"rotina","label":"Manual • 10","title":"Rotina de produção e revisão","blocks":[{"t":"table","head":["Bloco semanal","Tempo de referência","Entrega"],"rows":[["Escolher e adaptar","20 min","Selecionar as 3 pautas da semana e uma finalidade por peça."],["Redigir e revisar","35 min","Usar os prompts; revisar precisão, limites e voz."],["Montar no Canva","45 min","Duplicar 2 carrosséis e uma capa de Reel."],["Gravar e legendar","30 min","Um Reel em uma ou duas tomadas, com legendas revisadas."],["Publicar e responder","30 min","Distribuir ao longo da semana; manter contato administrativo."],["Medir e decidir","20 min","Registrar resultados e escolher um ajuste para a próxima semana."]]},{"t":"p","text":"Total de referência: 3 horas. É uma hipótese de planejamento, não uma promessa de tempo: nas primeiras duas semanas, reserve tempo adicional para criar os modelos. Mensagens e demanda clínica podem exigir uma janela própria."},{"t":"h3","text":"Modo mínimo quando a agenda apertar"},{"t":"ul","items":["Mantenha 1 conteúdo educativo e 1 conteúdo sobre funcionamento por semana. Reaproveite o Reel como post de texto ou adie-o.","Não dobre o volume na semana seguinte para compensar. Retome a fila na ordem.","Produza com uma semana de antecedência. Guarde duas pautas sem data comemorativa como reserva."]},{"t":"h3","text":"Organização no Canva"},{"t":"p","text":"Crie uma pasta 'Letícia • Conteúdo' e subpastas 'Modelos', 'Em revisão', 'Aprovados' e 'Publicados'. Nomeie os arquivos com ID e tema: P04 Limites. Duplique o modelo antes de editar. Mantenha um documento com paleta, fontes, identificação e textos de contato."},{"t":"h3","text":"Revisão em sete perguntas"},{"t":"ul","items":["A peça tem uma ideia e o público aparece com clareza?","O texto descreve possibilidades sem diagnosticar quem lê?","Algum dado, credencial ou caso foi inventado pela IA?","Há nome profissional e CRP legíveis na identificação da peça?","Uma pessoa consegue ler a capa no celular sem ampliar?","O convite é adequado à sensibilidade do tema?","O contato funciona e a agenda comporta a procura?"]},{"t":"p","text":"Para escolher horário, comece com dois períodos em que ela possa acompanhar a publicação. Depois use os próprios Insights. Não existe 'melhor horário' universal adotado neste plano."}]},{"id":"cores","label":"Manual • 11","title":"Manual de cores e tipografia","blocks":[{"t":"p","text":"A base atual usa luz quente, tons terrosos e fotografias pessoais. A proposta preserva essa familiaridade, com fundos mais limpos e contraste maior. As leituras de cor abaixo são intenções editoriais e associações culturais possíveis; não são efeitos psicológicos universais nem mecanismos comprovados de conversão."},{"t":"palette","items":[{"name":"Creme","hex":"#F7F2E8","reading":"Respiro e proximidade","use":"Base de carrosséis educativos e dúvidas."},{"name":"Café","hex":"#342C29","reading":"Presença e legibilidade","use":"Texto principal, identificação e títulos."},{"name":"Ameixa","hex":"#5B3B50","reading":"Introspecção e diferenciação","use":"Capas sobre identidade, vínculos e reflexão."},{"name":"Sálvia","hex":"#DDE7DE","reading":"Pausa e organização","use":"Fundos de processo, FAQ e modalidades."},{"name":"Verde escuro","hex":"#36574A","reading":"Estabilidade e clareza","use":"Texto sobre sálvia, divisores e orientação de acesso."},{"name":"Terracota","hex":"#9C4F3F","reading":"Calor e ênfase","use":"Pequenos destaques e convites sobre creme."},{"name":"Areia","hex":"#D6B57A","reading":"Luz e continuidade","use":"Detalhes de apoio; evitar texto pequeno sobre branco."}]},{"t":"h3","text":"Como escolher na prática"},{"t":"ul","items":["Tema reflexivo: ameixa com texto creme; uma frase curta de abertura.","Tema educativo: creme com texto café; realces terracota em uma ou duas palavras.","Tema de processo: sálvia com texto verde escuro; listas e passos numerados.","Convite: uma área terracota ou ameixa com texto creme, sem aparência de urgência."]},{"t":"p","text":"Não reserve rosa para mulheres e arco-íris para LGBT+. A inclusão é comunicada pelo texto, pelas imagens e pelo cuidado. Se usar símbolos de orgulho, integre-os com sentido e mantenha a legibilidade; não use cor como substituto de posicionamento."},{"t":"h3","text":"Tipografia e contraste"},{"t":"p","text":"No Canva, comece com Lora nos títulos e Montserrat nos textos, se disponíveis na conta. Use no máximo duas famílias, com poucos pesos. O guia demonstra a mesma hierarquia com Georgia e Arial, sem depender de fontes externas. Evite letras muito estreitas e blocos em caixa alta."},{"t":"p","text":"Referência de acessibilidade: contraste mínimo de 4,5:1 para texto comum e 3:1 para texto grande. No material, prefira café/creme, creme/ameixa e verde escuro/sálvia. Teste a exportação reduzida no celular, incluindo rodapés. [19]"}]},{"id":"canva","label":"Manual • 12","title":"Três modelos para reproduzir no Canva","blocks":[{"t":"p","text":"Os modelos visuais abaixo são esquemas de composição, não capturas do Canva. Crie os elementos com texto e formas simples. Substitua apenas o conteúdo; conserve margens, posições e hierarquia."},{"t":"mocks","items":[{"model":"a","parts":["RELAÇÕES E ESCOLHAS","Dizer não também pode ser difícil.","Uma reflexão sobre limites.","Letícia Alves · Psicóloga CRP 14/11055"]},{"model":"b","parts":["IDENTIDADE E CUIDADO","Sua história não cabe em um rótulo.","Psicoterapia e diversidade.","Letícia Alves · Psicóloga CRP 14/11055"]},{"model":"c","parts":["COMEÇAR A TERAPIA","O que posso perguntar antes?","Modalidades · Horários · Funcionamento","Letícia Alves · Psicóloga CRP 14/11055"]}]},{"t":"table","head":["Modelo","Construção sugerida","Uso"],"rows":[["A • Educativo","1080 × 1350 px; margem 80 px; fundo creme; título café 76–88; texto 38–44; uma palavra terracota.","Limites, autocobrança, descanso e comparação."],["B • Reflexão","1080 × 1350 px; fundo ameixa; título creme 76–88; uma linha de contexto 36–42; sem foto atrás do texto.","Pertencimento, identidade, autonomia e relações."],["C • Processo","1080 × 1350 px; fundo sálvia; título verde 70–82; até 3 passos; texto 36–42.","Primeira sessão, online/presencial e agendamento."]]},{"t":"p","text":"Os tamanhos são pontos de partida no editor. Ajuste à fonte e ao texto, sem ultrapassar as margens. Um slide interno deve ter, em regra, uma ideia e cerca de 25–45 palavras. A capa funciona melhor com poucas palavras; explicações longas ficam nos slides seguintes ou na legenda."},{"t":"h3","text":"Receita de montagem"},{"t":"ul","items":["Crie o arquivo, desenhe uma área guia de 80 px em cada margem e apague-a antes de exportar.","Posicione categoria no alto, título na região central e identificação profissional no rodapé.","Duplique a página para os slides internos. Use uma coluna de texto e uma hierarquia previsível.","No último slide, acrescente um único convite e indicação do contato, sem promessas ou pressão.","Exporte e veja no celular em tamanho de leitura real; reforce contraste e aumente textos pequenos."]},{"t":"p","text":"Fotografia: use retratos reais da Letícia, sala sem pessoas atendidas e situações cotidianas sem encenação de paciente. Não use imagens de pessoas chorando para representar automaticamente o público LGBT+. Ao escolher imagens externas, confira licença e diversidade sem estereótipos."}]},{"id":"reels","label":"Manual • 13","title":"Manual de Reels e Stories","blocks":[{"t":"h3","text":"Estrutura de um vídeo de 35 a 50 segundos"},{"t":"table","head":["Momento","Função","Orientação"],"rows":[["0–3 s","Abrir a questão","Uma frase específica, sem apresentação longa."],["3–15 s","Desenvolver","Explique o contexto em linguagem cotidiana."],["15–25 s","Dar um exemplo","Situação ilustrativa, nunca relato de paciente disfarçado."],["20–30 s","Mudar o ritmo","Troque enquadramento, cartão de texto ou pergunta de reflexão."],["30–45 s","Fechar com nuance","Uma síntese útil e um convite coerente."]]},{"t":"p","text":"Grave em 1080 × 1920 px como formato de produção inicial, com celular à altura dos olhos, luz à frente e áudio compreensível. Mantenha título, legendas e identificação na região central, afastados das bordas e dos controles da interface. Confira a prévia de cada posicionamento antes de publicar ou anunciar."},{"t":"h3","text":"Exemplo de gancho com continuidade"},{"t":"copy","text":"Antes da primeira sessão, muita gente acha que precisa saber exatamente o que dizer. Mas começar não exige um discurso pronto."},{"t":"p","text":"Na sequência, explique o que pode ser conversado, que dúvidas podem ser feitas e que o ritmo é individual. Evite o gancho 'se você faz isso, tem trauma' ou promessas de mudança rápida."},{"t":"h3","text":"Stories que ajudam sem expor"},{"t":"ul","items":["Tela 1: 'Uma dúvida comum antes de começar a terapia: preciso contar tudo na primeira sessão?'","Tela 2: 'A conversa pode acontecer aos poucos. O início também serve para conhecer o funcionamento do atendimento.'","Tela 3: 'No post de hoje explico esse começo. Para informações de agenda, use o contato do perfil.'"]},{"t":"h3","text":"Presença humana com limite profissional"},{"t":"p","text":"Mostre preparação do espaço, um livro cuja leitura possa ser comentada com precisão ou uma explicação curta diante da câmera. Evite filmar antes/depois de atendimentos com horários, notificações, vozes, prontuários ou pessoas identificáveis. Rotina pessoal pode aparecer se contribuir para a apresentação profissional e respeitar os limites que ela escolher."},{"t":"p","text":"Legendas automáticas precisam de revisão, especialmente nomes, termos de identidade e expressões clínicas. O vídeo deve ser compreensível sem som; texto e voz devem acrescentar contexto, sem disputar atenção."}]},{"id":"ads","label":"Manual • 14","title":"Aquisição paga e prioridades","blocks":[{"t":"note","text":"Recomendação inicial: organizar perfis e contato, manter conteúdo por duas semanas e então testar um único canal. Com verba pequena, a Pesquisa Google tende a ser uma hipótese inicial mais direta para captar procura por psicoterapia; Meta pode ser um segundo teste de identificação e descoberta. Esta é uma decisão de planejamento, não uma previsão de desempenho."},{"t":"table","head":["Canal","Ponto forte","Limitação","Quando testar"],"rows":[["Pesquisa Google","Alcança pessoas pesquisando o serviço naquele momento.","Pode ter pouco volume local e custo por clique alto.","Quando houver destino claro, agenda e estimativa de orçamento."],["Instagram/Meta","Permite apresentar a profissional e sua postura em vídeo.","Pode gerar interação sem procura e tem limites para atributos pessoais.","Após validar mensagem, com capacidade de responder e avaliar a origem."],["Orgânico + ficha Google","Constrói presença e reduz custo direto de mídia.","Resultados podem ser lentos e irregulares.","Desde o início, com rotina sustentável."]]},{"t":"h3","text":"O que significa direcionar para esse público"},{"t":"p","text":"O recorte deve aparecer no serviço, no texto e nas pautas. Isso permite identificação voluntária. Não é necessário nem adequado inferir orientação sexual, saúde mental ou identidade de gênero a partir de listas, interesses ou comportamento. As políticas do Google limitam públicos criados pelo anunciante em categorias sensíveis; a Meta proíbe anúncios que afirmem ou insinuem atributos pessoais do destinatário. [17][18]"},{"t":"h3","text":"Condições para abrir o teste"},{"t":"ul","items":["Identificação e formação revisadas; descrição e contato funcionando.","Página de destino informativa, se usada: serviço, público, modalidades, local, identificação e contato. Sem formulário clínico ou promessa.","Orçamento que possa ser gasto integralmente como teste, com limite e data de revisão.","Agenda recorrente disponível e janela de resposta administrativa.","Registro simples da origem e de primeiras sessões, sem exportar dados clínicos para plataformas."]},{"t":"p","text":"As peças deste manual são propostas para revisão. Nada foi publicado e nenhuma campanha foi criada ou ativada. Aprovação de anúncio depende também da conta, do destino e da análise da plataforma."}]},{"id":"googleads","label":"Manual • 15","title":"Google Ads na prática","blocks":[{"t":"h3","text":"Estrutura inicial sugerida"},{"t":"p","text":"Uma campanha de Pesquisa, focada em Campo Grande/MS, sem dividir a verba entre muitos públicos. Comece com local e serviço; deixe o teste nacional de atendimento online para uma fase separada. A presença na cidade deve ser a opção geográfica preferida quando disponível, evitando tratar apenas interesse na cidade como presença real."},{"t":"table","head":["Configuração","Ponto de partida"],"rows":[["Rede","Pesquisa; manter Display e parceiros fora do piloto para facilitar a leitura."],["Público","Adultos; não aplicar listas de pacientes, remarketing ou públicos semelhantes. Não restringir por suposições sobre identidade."],["Palavras-chave","Começar com correspondência de frase e exata; revisar os termos realmente acionados."],["Lances","Se não houver conversão confiável, avaliar estratégia inicial de cliques com limite de CPC coerente com o planejamento. Não inventar CPA alvo."],["Destino","Página informativa real e funcional. Sem site adequado, priorizar a preparação do destino antes de investir."],["Horário","Compatível com a operação e a possibilidade de responder; avaliar com dados, sem regra universal."]]},{"t":"h3","text":"Grupos de intenção e lista inicial"},{"t":"table","head":["Grupo","Frase ou exata para testar","Observação"],"rows":[["Local","'psicóloga campo grande ms'; [psicóloga campo grande]","Examinar termos para evitar confusão com o bairro do Rio de Janeiro."],["Mulheres","'psicóloga para mulheres'; [psicoterapia para mulheres]","Comunicar o serviço, sem afirmar a condição de quem pesquisa."],["Diversidade","'psicóloga lgbt'; 'terapia lgbt'","Teste contextual sujeito à política; não associar a públicos sensíveis."]]},{"t":"p","text":"Aspas e colchetes acima indicam correspondência de frase e exata no cadastro; use a sintaxe da plataforma. Os termos são hipóteses, sem volume confirmado. Se o grupo de diversidade for restrito, revise a classificação e as políticas; não remova o acolhimento real do destino para tentar contornar a análise."},{"t":"h3","text":"Negativas iniciais"},{"t":"p","text":"Emprego, vaga de emprego, salário, concurso, faculdade, graduação, curso, estágio, teste grátis, monografia. Se o serviço não for oferecido, considerar terapia de casal, avaliação neuropsicológica e infantil. Só negativar 'gratuito', 'convênio' e termos similares se forem incompatíveis com a prática real."},{"t":"p","text":"Revisar termos de busca duas vezes por semana, limitar regiões incompatíveis e checar se os contatos pedem o serviço efetivamente prestado. Não adicionar todos os temas clínicos e cidades em um único grupo."}]},{"id":"anunciosgoogle","label":"Manual • 16","title":"Textos e orçamento de Pesquisa","blocks":[{"t":"p","text":"Conjunto inicial de títulos e descrições para anúncio responsivo. O Google admite até 30 caracteres por título e 90 por descrição. Os textos abaixo foram contados com espaços. [20]"},{"t":"table","head":["Título","Caracteres"],"rows":[["Psicóloga em Campo Grande","25"],["Psicoterapia para Mulheres","26"],["Psicoterapia e Diversidade","26"],["Letícia Alves | Psicóloga","25"],["Presencial e Online","19"],["Conheça o Atendimento","21"],["Informações de Agendamento","26"],["Escuta e Cuidado Individual","27"]]},{"t":"table","head":["Descrição","Caracteres"],"rows":[["Psicoterapia para mulheres e pessoas LGBT+. Atendimento em Campo Grande/MS e online.","84"],["Conheça as modalidades e o funcionamento da psicoterapia. Consulte os horários.","79"],["Letícia Alves, Psicóloga. CRP 14/11055. Informações e agendamento pelo contato.","79"],["Cuidado individualizado com respeito à história e à identidade de cada pessoa.","78"]]},{"t":"p","text":"Identificação: o anúncio e o destino precisam preservar a identificação profissional. Não deixe a exibição do nome e CRP depender apenas de uma combinação eventual. Revise a fixação de recursos e a prévia; se o nome completo profissional for maior que o usado neste material, adapte o conjunto antes de publicar."},{"t":"h3","text":"Orçamento como experimento"},{"t":"p","text":"Suposição de verba para ilustração: teto de mídia de R$ 600 para um teste. Para uma campanha padrão que use orçamento diário médio, R$ 19,70 × 30,4 resulta em R$ 598,88 de referência mensal. O gasto diário pode variar; configuração, período parcial, alteração de orçamento e regras da campanha devem ser conferidos. Não é um orçamento ativado nem uma previsão de contatos. [21]"},{"t":"p","text":"Antes do lançamento, use a estimativa local de CPC para calcular quantos cliques a verba poderia financiar: cliques aproximados = verba ÷ CPC estimado. Isso mede capacidade do teste, não resultado. Se a estimativa indicar poucos cliques, concentre termos e período ou adie o teste; não acrescente segmentações sensíveis para compensar."},{"t":"h3","text":"Como julgar sem prometer retorno"},{"t":"p","text":"Exemplo puramente aritmético: R$ 600 gastos, 20 conversas novas sobre atendimento, 8 primeiras sessões agendadas e 6 realizadas. Custo por conversa = R$ 30; por agendamento = R$ 75; CAC de mídia por início = R$ 100. Não são metas nem benchmarks. Acrescente custos de criação, gestão e ferramentas para obter CAC total."},{"t":"p","text":"Diagnóstico do piloto: sem cliques, rever demanda e elegibilidade; cliques sem contato, rever destino; contato sem agendamento, rever compatibilidade e condições; faltas, rever alinhamento e confirmação."}]},{"id":"meta","label":"Manual • 17","title":"Meta Ads sem inferir identidade","blocks":[{"t":"h3","text":"Piloto separado do teste de Pesquisa"},{"t":"p","text":"Suposição operacional: R$ 350 de mídia em 14 dias, cerca de R$ 25 por dia ou orçamento total de R$ 350 se disponível. Um conjunto amplo para adultos em Campo Grande, todos os gêneros, dois criativos com a mesma informação de serviço e convites distintos. Isso é uma proposta de teste, não uma autorização de gasto nem um benchmark."},{"t":"p","text":"No Gerenciador, escolha a configuração disponível que permita conversar pelo WhatsApp profissional, se esse canal estiver habilitado. Confira destino, região, idade e expansão de público na configuração real. Não selecione interesses como saúde mental, orientação sexual ou identidades como tentativa de identificar pessoas. Nesta fase, não use listas de pacientes, lookalikes ou remarketing de páginas clínicas."},{"t":"table","head":["Criativo","Formato e texto principal","Convite"],"rows":[["A • Apresentação","Vídeo da Letícia: 'Psicoterapia para mulheres e pessoas LGBT+, com respeito à história e ao contexto de cada pessoa. Atendimento presencial em Campo Grande/MS e online.'","Conheça o funcionamento e consulte a disponibilidade."],["B • Processo","Arte sálvia: 'Como funciona começar a psicoterapia?' Texto: 'O primeiro contato pode esclarecer modalidades, funcionamento e agenda. Letícia Alves, Psicóloga, CRP 14/11055.'","Saiba mais pelo contato profissional."]]},{"t":"h3","text":"Formulações para revisar"},{"t":"table","head":["Evitar em anúncio","Reescrever"],"rows":[["Você é LGBT e sofre de ansiedade?","Psicoterapia com acolhimento a pessoas LGBT+."],["Mulher, sua autoestima está destruída?","Psicoterapia para mulheres: conheça o atendimento."],["Cansada de sofrer? Resolva agora.","Informações sobre psicoterapia e disponibilidade de horários."],["Sabemos o que você está passando.","Escuta e cuidado individualizado, com respeito à sua história."]]},{"t":"p","text":"A política trata de afirmar ou insinuar características pessoais; mencionar um público ou serviço em termos gerais é diferente de declarar que o destinatário possui uma condição. Mesmo uma redação cuidadosa pode ser analisada ou restringida conforme o contexto. [18]"},{"t":"h3","text":"Proteção dos dados e revisão"},{"t":"p","text":"Não envie prontuários, orientação sexual, sintomas, mensagens ou listas de pacientes para pixels, API de conversões ou listas de audiência. Não disfarce um evento sensível com nome genérico. Se houver mensuração técnica, avalie a categorização de saúde, os termos da ferramenta e a base legal antes de implementá-la. O piloto pode usar contagem agregada manual. [22][23]"},{"t":"p","text":"Compare as peças por procura compatível e primeiras sessões realizadas, com a limitação de uma amostra pequena. A entrega de verba entre dois anúncios pode ser desigual; isso não é um teste estatístico controlado."}]},{"id":"metricas","label":"Manual • 18","title":"Métricas que orientam decisões","blocks":[{"t":"table","head":["Indicador","Cálculo ou registro","Uso"],"rows":[["Conversas novas","Contatos únicos sobre atendimento, sem spam ou retomadas já contadas.","Medir procura; não contar toda mensagem como cliente."],["Procura compatível","Serviço, modalidade, região e agenda compatíveis.","Avaliar clareza do posicionamento, sem classificar identidade."],["Agendamentos","Primeiras sessões marcadas.","Observar a passagem do contato à agenda."],["Inícios","Primeiras sessões efetivamente realizadas.","Medir aquisição realizada, sem pressupor continuidade."],["CAC de mídia","Gasto com mídia ÷ inícios atribuídos ao canal.","Comparar custo direto; se zero inícios, registrar 'sem início', não zero reais."],["CAC total","Mídia + criação + gestão + ferramentas alocadas ÷ inícios.","Avaliar viabilidade real."],["Saves e envios","Salvamentos e compartilhamentos do post.","Sinais de utilidade; não são desfechos clínicos."],["Seguidores","Variação líquida no período.","Indicador secundário de alcance e afinidade."]]},{"t":"h3","text":"Registro sem prontuário"},{"t":"p","text":"Use uma planilha administrativa restrita ou um caderno: semana, canal informado, total de conversas novas, total compatível, agendadas, realizadas e gasto. Não coloque nome, orientação sexual, identidade, sintomas ou conteúdo de sessão em um painel de marketing. Se for necessário evitar duplicidade, use um controle administrativo separado e protegido."},{"t":"p","text":"Atribuição: pergunte 'Como você conheceu meu trabalho?' e registre Instagram orgânico, anúncio Instagram, Google, indicação ou não informado. Uma pessoa pode passar por vários canais; essa informação não comprova causalidade. Não some alcance de plataformas como pessoas únicas."},{"t":"h3","text":"Revisão semanal em quinze minutos"},{"t":"ul","items":["Qual pauta gerou uma dúvida real sobre atendimento?","As conversas eram compatíveis com o serviço e com a agenda?","Em qual etapa o caminho ficou confuso?","Qual única mudança será feita na próxima semana?"]},{"t":"h3","text":"Regras de decisão"},{"t":"p","text":"Pausa imediata se o contato estiver quebrado, a agenda estiver indisponível, houver irregularidade na identificação ou restrição relevante de política. Revisão financeira ao chegar ao teto definido antes do teste. Não escalar apenas porque o custo por clique caiu; é preciso haver procura compatível e capacidade de cuidado."},{"t":"p","text":"O teto de CAC precisa considerar honorários, tempo, custos, tributos e ocupação. Sem esses dados, não foi calculado um retorno financeiro. Retenção e alta são decisões clínicas; não devem ser pressionadas para melhorar o resultado de marketing."}]},{"id":"actionplan","label":"Manual • 19","title":"Actionplan de 90 dias","blocks":[{"t":"table","head":["Quando","Ação concreta","Responsável","Critério de conclusão"],"rows":[["Dias 1–2","Confirmar identificação, formações, modalidades, público adulto e vagas recorrentes.","Letícia","Ficha de serviço revisada por ela."],["Dias 1–3","Atualizar bio e descrição, testar contato, nomear destaques e conferir ficha Google.","Letícia e Jean","Pessoa de teste consegue chegar ao contato correto."],["Dias 3–7","Conferir cadastro do MundoPsicólogos e outros perfis; atualizar os dados que forem dela.","Letícia/Jean","Instagram e endereço consistentes nos cadastros acessíveis."],["Semana 1","Criar 3 modelos de Canva e preparar P01, P02 e P03.","Letícia","Três posts revisados e prontos para fixar."],["Semana 2","Executar calendário e registrar linha de base administrativa.","Letícia","Duas semanas de conteúdo e registro de procura."],["Semanas 3–4","Se houver verba e destino adequado, iniciar um piloto de aquisição.","Jean com revisão da Letícia","Limite, configuração, textos e métricas documentados antes do gasto."],["Dia 30","Revisar mensagens, contato e compatibilidade dos pedidos.","Ambos","Uma mudança escolhida com base nos dados."],["Dias 31–60","Manter rotina e aprofundar duas pautas que geraram dúvidas úteis.","Letícia","Oito semanas completas ou ritmo mínimo mantido."],["Dias 61–90","Comparar procura e capacidade; repetir, ajustar ou encerrar o piloto.","Ambos","Decisão financeira e operacional registrada."]]},{"t":"h3","text":"Divisão de trabalho recomendada"},{"t":"p","text":"Letícia responde pela precisão clínica, identificação e limites éticos, além da própria voz. Jean pode organizar arquivos, links, calendário, configuração técnica e leitura agregada das métricas. Terceiros não precisam acessar relatos pessoais para apoiar o marketing."},{"t":"h3","text":"Lista de execução para hoje"},{"t":"ul","items":["Copiar a descrição e a bio após a conferência de identificação.","Abrir o link de contato no próprio celular e testar o destino.","Criar no Canva uma capa com o modelo A e uma com o modelo C.","Preparar a apresentação P01 antes de buscar mais temas."]},{"t":"p","text":"Se o projeto atrasar, preserve as dependências: identificação e contato → materiais de apresentação → rotina → aquisição paga. Não é necessário concluir todos os capítulos para publicar a primeira peça revisada."}]},{"id":"etica","label":"Manual • 20","title":"Revisão ética aplicada ao plano","blocks":[{"t":"p","text":"O CFP permite divulgar público atendido, formação real e abordagem, com publicidade coerente com a ciência e a ética. A profissional continua responsável pelo conteúdo, inclusive quando a criação é apoiada por IA ou por outra pessoa. [1][2]"},{"t":"table","head":["Tema","Como aplicar"],"rows":[["Identificação","Nome completo ou nome social profissional, Psicóloga e CRP. Conferir registro e identificação legível nas peças."],["Qualificação","Distinguir curso concluído, em andamento, abordagem e título. Não anunciar o que não foi confirmado."],["Resultados","Sem garantia, cura prometida, prazo taxativo, antes/depois ou superioridade sobre outros profissionais."],["Preço","Sem desconto, sorteio, sessão grátis ou valor como propaganda. Informar honorários com clareza no contato adequado."],["Sigilo","Sem prints de atendimento, histórias reconhecíveis, depoimentos promocionais ou respostas públicas que confirmem vínculo."],["Conteúdo educativo","Sem testes privativos, diagnóstico de seguidores ou instruções que substituam avaliação individual."],["Diversidade","Sem patologizar orientação sexual ou identidade de gênero; sem pressão para exposição ou mudança de identidade."],["Dados","Coletar o mínimo necessário e proteger acesso. Não usar informações clínicas para segmentação."]]},{"t":"h3","text":"Atendimento online"},{"t":"p","text":"A Resolução CFP 09/2024 substituiu normas anteriores e encerrou a exigência do cadastro e-Psi. O CRP14/MS destaca a avaliação de adequação das tecnologias e a proteção do sigilo. Não anuncie que o e-Psi é uma certificação atual necessária. Atendimento fora do Brasil exigiria análise própria de regras e condições, não contemplada pelo piloto local. [14]"},{"t":"h3","text":"Limites que ainda precisam de confirmação"},{"t":"ul","items":["Se 'Letícia Alves' corresponde ao nome profissional completo ou nome social que deve aparecer na publicidade.","Situação ativa do CRP 14/11055 e redação exata de cada formação.","Faixa etária atendida, experiência real em cada tema e necessidade de capacitação/supervisão.","Serviços, duração, honorários, agenda, política administrativa e canais de resposta."]},{"t":"p","text":"Este capítulo orienta a revisão das peças propostas. Questões específicas sobre titulação, adolescentes, avaliações públicas ou uso de dados devem ser verificadas com as normas aplicáveis e, quando necessário, com o CRP14/MS. O plano não depende de expor pessoas atendidas para produzir conteúdo."}]},{"id":"prompts","label":"Manual • 21","title":"Como usar os prompts em um chat novo","blocks":[{"t":"p","text":"Cada pauta do calendário possui um prompt autossuficiente: ele repete o contexto, o público, a finalidade, os limites e o formato esperado. Abra um chat novo no ChatGPT gratuito e cole o prompt inteiro. Não é necessário que a conta se lembre desta conversa."},{"t":"h3","text":"Fluxo em cinco passos"},{"t":"ul","items":["Escolha o ID da pauta, como P04, no calendário.","Clique em 'Copiar prompt' no guia HTML ou copie o bloco correspondente do arquivo de prompts.","Cole em um novo chat e peça a primeira versão completa.","Revise termos, exemplos, identificação e qualquer afirmação clínica antes de levar ao Canva.","Se houver dado, fonte, credencial ou caso inventado, apague e solicite correção; não publique sem verificação."]},{"t":"copy","text":"Revise a peça que você acabou de escrever. Aponte frases genéricas, pressupostos sobre identidade, linguagem que sugere diagnóstico, promessas de resultado, exposição de intimidade e credenciais não fornecidas. Reescreva o conteúdo inteiro com frases mais concretas e naturais. Preserve uma ideia por slide e um único convite final. Não acrescente estatísticas, casos clínicos ou fontes não verificadas."},{"t":"h3","text":"Prompt para montar no Canva a partir do texto"},{"t":"copy","text":"Transforme o conteúdo revisado desta conversa em instruções de montagem no Canva para uma pessoa que já sabe usar o editor. Formato 1080 × 1350 px. Margens de 80 px, fundo creme #F7F2E8, texto café #342C29 e ênfase terracota #9C4F3F; para uma pauta de processo, use sálvia #DDE7DE e verde #36574A. Sugira Lora nos títulos e Montserrat no corpo, conforme disponibilidade. Entregue, para cada slide: texto final, hierarquia, tamanho inicial da fonte, posição, quebra de linhas e descrição de formas simples. Use uma ideia por slide, cerca de 25 a 45 palavras nos internos e rodapé profissional legível. Não invente logotipo, fotografia, depoimento ou informação de atendimento."},{"t":"h3","text":"Prompt para uma nova ideia fora do calendário"},{"t":"copy","text":"Quero criar uma nova peça educativa para o Instagram de Letícia Alves, psicóloga, CRP 14/11055, com foco em mulheres e pessoas LGBT+, presencial em Campo Grande/MS e online. Antes de escrever, peça somente tema, público específico e formato se não estiverem claros na minha mensagem. Não invente formação, honorários, experiência, caso ou estatística. Depois entregue gancho, desenvolvimento completo, legenda, um convite e orientação de Canva. Trate identidade com respeito, sem patologização, diagnóstico de quem lê, promessa, pressão para se expor ou uso de histórias clínicas. Mantenha o texto natural, específico e acessível. Finalize com os pontos que a profissional precisa revisar."},{"t":"note","text":"Limite da IA: redação não é validação clínica. Não envie nomes, mensagens, fotos, prontuários ou histórias reconhecíveis de pacientes. Para incluir pesquisa, forneça uma fonte efetivamente conferida ou solicite que a IA declare que não conseguiu verificá-la."}]},{"id":"prontos1","label":"Manual • 22","title":"Peça pronta P01 quem eu atendo","blocks":[{"t":"p","text":"Carrossel de apresentação para fixar. O texto abaixo é uma proposta editorial baseada no serviço informado. A profissional deve conferir sua identificação e seu escopo antes de publicar."},{"t":"table","head":["Slide","Texto final"],"rows":[["1","Psicoterapia para mulheres e pessoas LGBT+"],["2","Sou Letícia Alves, psicóloga. Meu trabalho é oferecer escuta e cuidado individualizado, considerando a história e o contexto de cada pessoa."],["3","Entre os temas que podem aparecer no atendimento estão ansiedade, autoestima, autocobrança e dificuldades nas relações. Cada processo começa pela compreensão do que faz sentido para aquela pessoa."],["4","Orientação sexual e identidade de gênero não são problemas a serem corrigidos. O cuidado precisa respeitar quem você é, sem reduzir sua história a uma única característica."],["5","Há espaço para falar de dificuldades, mas também de vínculos, projetos, escolhas e possibilidades. Você não precisa chegar com todas as respostas."],["6","Os atendimentos são presenciais em Campo Grande/MS e online. As condições e a adequação de cada modalidade são conversadas no contato com a profissional."],["7","Quer conhecer o funcionamento da psicoterapia? Use o contato do perfil para informações e disponibilidade. Letícia Alves • Psicóloga • CRP 14/11055"]]},{"t":"h3","text":"Legenda pronta"},{"t":"copy","text":"Procurar psicoterapia também pode envolver dúvidas sobre encontrar uma escuta que respeite sua história.\n\nSou Letícia Alves, psicóloga, e meu trabalho tem foco no atendimento de mulheres e pessoas LGBT+. As demandas podem envolver ansiedade, autoestima, autocobrança, relações e outros temas que façam sentido para cada pessoa.\n\nA identidade de alguém não resume sua história e não é algo a ser corrigido. O atendimento considera experiências, vínculos e contexto, com cuidado individualizado.\n\nAtendo presencialmente em Campo Grande/MS e online. Para conhecer o funcionamento e consultar a disponibilidade de horários, use o contato do perfil.\n\nLetícia Alves • Psicóloga • CRP 14/11055"},{"t":"p","text":"Canva: modelo C; capa com uma frase, slides internos sem foto de fundo, identificação legível em cada página. Nos Stories, apresente serviço, modalidades e onde obter informações. Não inserir selo de especialização sem confirmação."}]},{"id":"prontos2","label":"Manual • 23","title":"Peça pronta P02 primeira sessão","blocks":[{"t":"p","text":"Reel de aproximadamente 45 segundos, conforme o ritmo de fala. Grave uma tomada principal e um corte no meio. O roteiro não fixa duração ou procedimentos de uma sessão clínica."},{"t":"table","head":["Tempo","Fala","Imagem e texto"],"rows":[["0–3 s","Você não precisa chegar à primeira sessão com tudo organizado.","Olhar para a câmera. Texto: 'Preciso saber o que dizer?'"],["3–14 s","Muita gente imagina que precisa saber explicar exatamente o que sente, escolher por onde começar ou ter uma história pronta.","Mesmo plano, voz natural. Legenda revisada."],["14–24 s","Mas esse começo também pode incluir dúvidas, silêncio e dificuldade de encontrar palavras. Você pode dizer que não sabe por onde começar.","Corte leve de enquadramento. Texto: 'Dizer que não sabe também é um começo.'"],["24–35 s","A primeira conversa também serve para conhecer o funcionamento do atendimento. O que será compartilhado pode ser construído aos poucos, respeitando o contexto de cada pessoa.","Cartão curto: 'Conhecer o processo • Tirar dúvidas'."],["35–45 s","Sou Letícia Alves, psicóloga. Atendo em Campo Grande e online. Para informações sobre a psicoterapia, use o contato do perfil.","Tela de fechamento com nome e CRP 14/11055."]]},{"t":"h3","text":"Legenda pronta"},{"t":"copy","text":"O começo da psicoterapia não exige uma explicação perfeita.\n\nPode haver dúvidas sobre o que dizer, por onde começar e como será o atendimento. A conversa inicial também é uma oportunidade para conhecer esse funcionamento e apresentar perguntas.\n\nO ritmo e os temas variam conforme a história e as necessidades de cada pessoa. Não é preciso se obrigar a contar tudo de uma vez.\n\nPara informações sobre atendimento presencial em Campo Grande/MS ou online, use o contato do perfil.\n\nLetícia Alves • Psicóloga • CRP 14/11055"},{"t":"h3","text":"Stories prontos"},{"t":"ul","items":["'Uma dúvida comum: preciso saber exatamente o que falar na primeira sessão?'","'Você pode começar dizendo que ainda não sabe por onde começar. O início também serve para conhecer o atendimento.'","'Expliquei esse começo no Reel de hoje. Informações sobre funcionamento e agenda: contato do perfil.'"]},{"t":"p","text":"Revisão: conferir se a fala corresponde à forma real de trabalho da Letícia. Manter a identificação profissional legível e não acrescentar garantia de adaptação ou de resultado."}]},{"id":"prontos3","label":"Manual • 24","title":"Peça pronta P03 como pedir informações","blocks":[{"t":"table","head":["Slide","Texto final"],"rows":[["1","O que perguntar antes de agendar terapia?"],["2","Você pode começar pelas condições práticas: quais modalidades são oferecidas e como funciona o contato com a profissional."],["3","Também pode perguntar sobre horários e honorários. Ter essas informações ajuda a avaliar se o atendimento cabe na sua rotina e nas suas possibilidades."],["4","Não é necessário apresentar um diagnóstico pronto ou contar toda a sua história na primeira mensagem. Esse contato pode ser usado para esclarecer o funcionamento."],["5","Se a modalidade for online, vale perguntar sobre condições de privacidade, conexão e organização do encontro. As possibilidades precisam ser avaliadas para cada contexto."],["6","No atendimento presencial, confirme o endereço, o horário combinado e como chegar. Aqui, o atendimento presencial acontece em Campo Grande/MS."],["7","Para conhecer o atendimento e consultar a disponibilidade, use o contato do perfil. Letícia Alves • Psicóloga • CRP 14/11055"]]},{"t":"h3","text":"Legenda pronta"},{"t":"copy","text":"Antes de começar a psicoterapia, dúvidas práticas também merecem espaço.\n\nVocê pode perguntar sobre modalidades, horários, honorários e funcionamento. Não precisa transformar a primeira mensagem em um relato detalhado da sua vida.\n\nO contato inicial ajuda a conhecer as condições do serviço e a avaliar se ele faz sentido para o seu momento. Informações clínicas e o andamento do processo têm um espaço próprio, com os cuidados necessários.\n\nAtendo presencialmente em Campo Grande/MS e online, com foco em mulheres e pessoas LGBT+. Para saber mais e consultar a disponibilidade, use o contato do perfil.\n\nLetícia Alves • Psicóloga • CRP 14/11055"},{"t":"p","text":"Canva: modelo C; destacar uma pergunta por slide, sem tabela de valores, chamada de promoção ou escassez. Verificar o link antes da publicação e fixar a peça junto com P01 e P02."}]},{"id":"calendario","label":"Execução • 8 semanas","title":"Calendário e prompts completos","blocks":[{"t":"p","text":"Três peças por semana, às segundas, quartas e sextas. Datas sugeridas a partir de 19/10/2026, sem obrigação de horário. Cada pauta inclui direção visual, Stories e um prompt autossuficiente. Altere a data inicial para deslocar o plano; escolha uma segunda-feira."}]},{"id":"fontes","label":"Evidências","title":"Fontes e limites da pesquisa","blocks":[{"t":"p","text":"Consulta em 16/10/2026. A análise distingue observação dos prints, informações de páginas públicas e recomendações editoriais. CPC, volume de busca e resultado financeiro da clínica não foram obtidos."},{"t":"source","n":1,"title":"CFP • Código de Ética Profissional, especialmente arts. 9, 18, 19 e 20","desc":"","url":"https://site.cfp.org.br/wp-content/uploads/2022/06/WEB_29535_Codigo_de_etica_da_profissao_14.04-1.pdf"},{"t":"source","n":2,"title":"CFP • Nota Técnica 1/2022 sobre publicidade nas redes sociais","desc":"","url":"https://site.cfp.org.br/wp-content/uploads/2022/06/SEI_CFP-0612475-Nota-Tecnica.pdf"},{"t":"source","n":3,"title":"Google • Gerenciar links de redes sociais","desc":"","url":"https://support.google.com/business/answer/13580646?hl=pt-BR"},{"t":"source","n":4,"title":"Google • Editar o Perfil da Empresa","desc":"","url":"https://support.google.com/business/answer/3039617?hl=pt-BR"},{"t":"source","n":5,"title":"Google • Diretrizes para representar a empresa","desc":"","url":"https://support.google.com/business/answer/3038177?hl=pt-BR"},{"t":"source","n":6,"title":"Google • Melhorar classificação local","desc":"","url":"https://support.google.com/business/answer/7091?hl=pt-BR"},{"t":"source","n":7,"title":"CRP12 • Publicidade e uso de redes sociais na Psicologia","desc":"","url":"https://site.crpsc.org.br/publicidade-e-uso-de-redes-sociais-na-psicologia/"},{"t":"source","n":8,"title":"MundoPsicólogos • Cadastro público de Letícia Alves","desc":"","url":"https://br.mundopsicologos.com/procard/leticia-alves"},{"t":"source","n":9,"title":"Danielli Lopes • Site profissional","desc":"","url":"https://www.psicologadanielli.com/"},{"t":"source","n":10,"title":"Luiza Barros • Site profissional","desc":"","url":"https://www.luizabarrospsicologa.com/"},{"t":"source","n":11,"title":"Central Terapia • Página de atendimento LGBTQIAPN+","desc":"","url":"https://centralterapia.com.br/consulta/populacao-lgbtqia/"},{"t":"source","n":12,"title":"Rede Psicólogos • Página de atendimento LGBT+","desc":"","url":"https://redepsicologos.com.br/consulta/populacao-lgbt/"},{"t":"source","n":13,"title":"IBGE • PNS 2019, divulgação sobre diagnósticos referidos","desc":"","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/29471-pns-2019-cai-o-consumo-de-tabaco-mas-aumenta-o-de-bebida-alcoolica"},{"t":"source","n":14,"title":"CRP14/MS • Resolução CFP 09/2024 e encerramento do e-Psi","desc":"","url":"https://crpms.org.br/resolucao-cfp-no-09-2024-regula-o-uso-de-tecnologias-digitais-na-psicologia-e-revoga-a-necessidade-de-cadastro-no-e-psi/"},{"t":"source","n":15,"title":"CFP • Resolução 01/1999 e práticas de reversão sexual","desc":"","url":"https://site.cfp.org.br/resolucao-01-99/o-que-e/"},{"t":"source","n":16,"title":"CFP • Resolução 01/2018","desc":"","url":"https://site.cfp.org.br/no-dia-da-visibilidade-trans-cfp-publica-resolucao-cfp-01-2018/"},{"t":"source","n":17,"title":"Google • Segmentação restrita na publicidade personalizada","desc":"","url":"https://support.google.com/adspolicy/answer/143465?hl=en"},{"t":"source","n":18,"title":"Meta • Privacidade e atributos pessoais nos anúncios","desc":"","url":"https://transparency.meta.com/policies/ad-standards/objectionable-content/privacy-violations-personal-attributes/"},{"t":"source","n":19,"title":"W3C • WCAG 2.2, contraste mínimo","desc":"","url":"https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html"},{"t":"source","n":20,"title":"Google • Criar anúncios responsivos de Pesquisa","desc":"","url":"https://developers.google.com/google-ads/api/docs/responsive-search-ads/create-responsive-search-ads?hl=pt-br"},{"t":"source","n":21,"title":"Google • Limites de gasto","desc":"","url":"https://support.google.com/google-ads/answer/10486637?hl=en"},{"t":"source","n":22,"title":"Meta • Requisitos de privacidade e uso de dados das ferramentas","desc":"","url":"https://www.facebook.com/business/help/363303621411154"},{"t":"source","n":23,"title":"Brasil • Lei Geral de Proteção de Dados","desc":"","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"},{"t":"endnote","text":"Base do caso: três prints enviados por Jean e descrição fornecida no pedido. Números dos prints são fotografias do momento. A pesquisa pública não substitui confirmação de registro, formação, escopo, agenda ou avaliação clínica. Recomendações são propostas para revisão da profissional; os anúncios não foram ativados."}]}],"posts":[{"id":"P01","title":"Quem eu atendo","audience":"Interseção e processo","format":"Carrossel","pillar":"Acolhimento a mulheres e pessoas LGBT+","goal":"Apresentar a profissional e ajudar a pessoa a reconhecer se o atendimento faz sentido.","hook":"Psicoterapia para mulheres e pessoas LGBT+: como é esse cuidado?","brief":"Serviço e público; respeito a histórias e identidades; demandas possíveis sem checklist diagnóstico; modalidades e local; como pedir informações.","cta":"Conheça o atendimento pelo contato do perfil.","visual":"C • sálvia","stories":"Apresentação; modalidades; contato profissional.","caution":"Pin de apresentação. Não anunciar especializações não confirmadas.","date":"2026-10-19","date_br":"19/10/2026","week":1,"prompt":"Você vai redigir uma peça educativa para o Instagram de Letícia Alves, psicóloga clínica, CRP 14/11055. O atendimento informado é presencial em Campo Grande/MS e online, com foco em mulheres e pessoas LGBT+. O foco editorial desta pauta é em pessoas adultas. A profissional revisará o conteúdo antes da publicação.\nNão invente nome completo, curso concluído, especialidade, abordagem, preço, duração, frequência, plataforma, vaga, experiência, caso clínico, estatística ou referência. Não use histórias de pacientes, mesmo anonimizadas. Se faltar informação operacional, escreva sem ela e sinalize fora do texto o que precisa ser confirmado.\nUse português brasileiro natural, direto e acolhedor. Trate mulheres trans como mulheres; não presuma gênero de parceiros, orientação ou diagnóstico de quem lê. Não patologize identidade, não pressione para se assumir e não reduza vivências LGBT+ a sofrimento.\nNão faça diagnóstico, teste de sintomas, promessa de cura, resultado garantido, prazo de melhora, comparação de superioridade, desconto ou depoimento. Exemplos devem ser cotidianos, explicitamente ilustrativos e não reconhecíveis como relatos clínicos. Não solicite confissões, trauma ou identidade nos comentários.\nEscreva uma ideia central por peça, com explicação concreta, nuance e um único convite. Não use 'sua melhor versão', 'basta querer', 'você se sabota' ou frases genéricas de autoajuda. Não acrescente números, estudos ou atribuições a autores sem fonte fornecida e conferida.\nIdentificação disponível: Letícia Alves, Psicóloga, CRP 14/11055. Não invente sobrenomes. Avise, fora da peça, que o nome completo ou nome social profissional e o registro precisam estar conferidos para a publicidade.\n\nPAUTA 01: Quem eu atendo\nPúblico editorial: Interseção e processo.\nPilar: Acolhimento a mulheres e pessoas LGBT+.\nObjetivo: Apresentar a profissional e ajudar a pessoa a reconhecer se o atendimento faz sentido.\nGancho de referência: Psicoterapia para mulheres e pessoas LGBT+: como é esse cuidado?\nDesenvolvimento obrigatório: Serviço e público; respeito a histórias e identidades; demandas possíveis sem checklist diagnóstico; modalidades e local; como pedir informações.\nÚnico convite final: Conheça o atendimento pelo contato do perfil.\nCuidado específico: Pin de apresentação. Não anunciar especializações não confirmadas.\nFormato: Carrossel.\nEntregue 7 slides completos: 1 capa com até 12 palavras; 2 a 6 desenvolvimento com uma ideia e aproximadamente 25 a 45 palavras cada; 7 fechamento e convite. Acrescente legenda de 120 a 180 palavras, texto alternativo por slide e orientação de montagem de cada página.\nDireção visual: C • sálvia. Formatos de produção: carrossel 1080 × 1350 px; Reel 1080 × 1920 px. Paleta: creme #F7F2E8, café #342C29, ameixa #5B3B50, sálvia #DDE7DE, verde escuro #36574A, terracota #9C4F3F. Priorize contraste, texto grande e margem. Sugira Lora e Montserrat conforme disponibilidade na conta do Canva; use formas simples e retratos reais autorizados, sem encenar pacientes.\nDepois da peça, entregue 3 Stories completos para divulgá-la, sem pedir informações sensíveis; uma adaptação de 60 a 90 palavras para o Perfil da Empresa no Google sem links dentro da descrição; e uma revisão com pontos clínicos, éticos e operacionais a conferir. Não trate o conteúdo orgânico como anúncio automaticamente; se eu quiser anúncio, faremos revisão própria das políticas.\nEntregue a primeira versão inteira, pronta para revisão, sem placeholders no conteúdo publicável. Não afirme ter pesquisado ou verificado algo que não verificou."},{"id":"P02","title":"A primeira sessão","audience":"Interseção e processo","format":"Reel","pillar":"Dúvidas antes de começar","goal":"Reduzir a exigência de chegar com um relato organizado.","hook":"Você não precisa chegar à primeira sessão com tudo organizado.","brief":"O início também serve para conhecer o funcionamento; dúvidas podem ser feitas; o ritmo de compartilhamento é individual; a conversa não exige discurso pronto.","cta":"Para informações sobre o atendimento, use o contato do perfil.","visual":"C • sálvia","stories":"Pergunta frequente; resposta breve; indicação do Reel.","caution":"Pin sobre processo. Não inventar duração, plataforma ou dinâmica fixa.","date":"2026-10-21","date_br":"21/10/2026","week":1,"prompt":"Você vai redigir uma peça educativa para o Instagram de Letícia Alves, psicóloga clínica, CRP 14/11055. O atendimento informado é presencial em Campo Grande/MS e online, com foco em mulheres e pessoas LGBT+. O foco editorial desta pauta é em pessoas adultas. A profissional revisará o conteúdo antes da publicação.\nNão invente nome completo, curso concluído, especialidade, abordagem, preço, duração, frequência, plataforma, vaga, experiência, caso clínico, estatística ou referência. Não use histórias de pacientes, mesmo anonimizadas. Se faltar informação operacional, escreva sem ela e sinalize fora do texto o que precisa ser confirmado.\nUse português brasileiro natural, direto e acolhedor. Trate mulheres trans como mulheres; não presuma gênero de parceiros, orientação ou diagnóstico de quem lê. Não patologize identidade, não pressione para se assumir e não reduza vivências LGBT+ a sofrimento.\nNão faça diagnóstico, teste de sintomas, promessa de cura, resultado garantido, prazo de melhora, comparação de superioridade, desconto ou depoimento. Exemplos devem ser cotidianos, explicitamente ilustrativos e não reconhecíveis como relatos clínicos. Não solicite confissões, trauma ou identidade nos comentários.\nEscreva uma ideia central por peça, com explicação concreta, nuance e um único convite. Não use 'sua melhor versão', 'basta querer', 'você se sabota' ou frases genéricas de autoajuda. Não acrescente números, estudos ou atribuições a autores sem fonte fornecida e conferida.\nIdentificação disponível: Letícia Alves, Psicóloga, CRP 14/11055. Não invente sobrenomes. Avise, fora da peça, que o no e isso apareça nos posts.|Ela fala também como parte da comunidade. Só vale se for verdade e se ela quiser que isso apareça nos posts.⟧","ia":"Ao falar de pessoas LGBT+, a Letícia pode falar de dentro da comunidade, com naturalidade, mas sem inventar detalhes de vida pessoal e sem usar a própria vivência como caso ou exemplo."}],"vozGuarda":"Limites que valem em qualquer voz: o tom muda, os limites éticos não. Linguagem acessível não é senso comum: o conteúdo continua coerente com a ciência psicológica e distingue opinião pessoal de posicionamento técnico. Sem sensacionalismo (exagero que superdimensiona um fato), medo, urgência ou promessa; sem diagnóstico por “sinais de que você tem…”; sem humor, meme ou gíria à custa de quem sofre, de identidades ou de pessoas atendidas; sem tendência, áudio viral ou desafio que exija expor paciente ou virar performance. Se uma expressão da moda gerar dúvida, use a frase neutra: o texto precisa ficar claro para quem não vive na internet.","vozLimites":["Conteúdo coerente com a ciência psicológica; opinião pessoal não vira posicionamento técnico.","Sem exagero, medo, urgência ou promessa.","Sem diagnóstico por “sinais de que você tem…”.","Sem humor, meme ou gíria à custa de quem sofre, de identidades ou de pessoas atendidas.","Sem tendência, áudio viral ou desafio que exponha paciente ou vire performance.","Na dúvida sobre uma expressão da moda, use a frase neutra: o texto precisa ficar claro para quem não vive na internet."],"vozCuidado":{"P04":"relações violentas","P17":"situações de risco","P19":"ambientes inseguros"},"vozReescrever":{"intro":"Reescreva a peça abaixo na voz descrita ao final, mantendo o sentido de cada trecho, a ordem dos slides (ou do roteiro), as informações práticas e o convite final.","regras":"Não acrescente promessa, dado, caso, preço, vaga, credencial ou fonte. Respeite os limites de palavras de cada slide e de caracteres da legenda. Entregue a peça inteira (slides ou roteiro, legenda e 3 Stories), pront ssões anotadas","Número de vagas recorrentes definido","Modalidades confirmadas","Foco em adultos confirmado"],"notas":[{"kind":"info","title":"⟦Fica só com você|Fica só com a Letícia⟧","text":"Esse registro é administrativo e fica ⟦na sua nota|na nota dela⟧. O app não pede esses dados."}],"done":"⟦Você consegue|Ela consegue⟧ responder “quanto custa” e “tem horário” sem hesitar.","chapters":["inicio","conversao"]},{"id":"contato","stage":"dias1","title":"Testar o link de contato","short":"Testar o link de contato","when":"Dias 1 e 2","who":"Letícia","min":5,"problem":"O número do WhatsApp foi copiado do print: (67) 99181-0336. Se faltar um dígito, o link leva a outra pessoa e ninguém avisa. O print também não mostra um link de agendamento claro na bio, e isso precisa ser conferido no aplicativo.","why":"O contato é o fim do caminho. Se ele falha, nada do que veio antes, como perfil, posts e anúncios, vira conversa.","steps":["Toque em “Abrir e testar o link” e veja se o WhatsApp abre.","Confira o número e a mensagem pronta: “Olá, vim pelo Instagram e gostaria de informações sobre psicoterapia.”","Peça a uma pessoa de confiança para fazer o caminho todo: do Instagram, pela bio, até a conversa.","Veja no aplicativo do Instagram se já existe um botão ou link de agendamento."],"copy":[{"label":"Link do WhatsApp com mensagem pronta","ref":["textos",3],"plain":true,"nocount":true,"nota":"A mensagem informa só a origem e o interesse pelo serviço. Não pede orientação sexual nem sintomas."}],"actions":[{"label":"Abrir e testar o link","ref":["textos",3],"ext":true}],"done":"A pessoa de teste chegou à conversa certa, partindo do perfil.","chapters":["textos","conversao"]},{"id":"bio","stage":"dias1","title":"Trocar a bio do Instagram","short":"Trocar a bio do Instagram","when":"Dias 1 a 3","who":"Letícia","min":10,"problem":"A bio de hoje, “Te ajudo a se tornar sua melhor versão”, é genérica e pode soar como cobrança por desempenho.","before":{"label":"Bio de hoje","text":"Te
