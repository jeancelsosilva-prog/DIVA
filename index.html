  }
  root.appendChild(sanfona('iPhone', passosIos(), { icon: 'phone', open: ios }));
  root.appendChild(sanfona('Android', passosAnd(), { icon: 'phone', open: !ios }));
  root.appendChild(nota('info', P('O nome dos botões muda um pouco conforme a versão do sistema e do navegador. Se não achar, procure por “instalar” ou “adicionar à tela inicial”.'), 'Não achou o botão?'));
  root.appendChild(sec('Sobre atualizações e privacidade', [
    P('Quando houver uma versão nova e o aparelho estiver com internet, o app avisa e basta tocar em Atualizar.'),
    P('O que é marcado (etapas, tarefas, registros, perfil e voz escolhida) fica só neste aparelho. Nada é enviado para ninguém. Se trocar de celular, use o backup em Ajustes.')
  ]));
  return { title: 'Instalar no celular', tab: 'mais', back: '#/mais', backLabel: 'Mais', node: root };
}

/* ---------- BUSCA ---------- */
var IDX = null;
function textosDe(b, t) {
  if (b.text) t.push(b.text);
  if (b.items) b.items.forEach(function (x) { t.push(typeof x === 'string' ? x : (x.name || '') + ' ' + (x.use || '')); });
  if (b.rows) b.rows.forEach(function (r) { t.push(r.join(' ')); });
  if (b.title) t.push(b.title);
  if (b.desc) t.push(b.desc);
}
function indice() {
  if (IDX) return IDX;
  IDX = [];
  G.chapters.forEach(function (c) { var t = []; c.blocks.forEach(function (b) { textosDe(b, t); }); IDX.push({ k: 'Capítulo', ic: 'book', title: c.title, to: '#/guia/' + c.id, text: t.join('\n') }); });
  POSTS.forEach(function (p) { IDX.push({ k: 'Pauta ' + p.id, ic: 'posts', title: p.id + ' ' + p.title, to: '#/pauta/' + p.id, text: [p.title, p.audience, p.hook, p.brief, p.goal, p.cta, p.caution, p.stories].join('\n') }); });
  TASKS.forEach(function (t) { IDX.push({ k: 'Tarefa', ic: 'checklist', title: R(t.title), to: '#/tarefa/' + t.id, text: R([t.title, t.problem || '', t.why || '', (t.steps || []).join(' ')].join('\n')) }); });
  // telas do app que não existem no guia original
  IDX.push({ k: 'Criar', ic: 'wave', title: 'Voz dos posts', to: '#/visual/voz', text: C.vozes.map(function (v) { return v.nome + '. ' + v.resumo + ' ' + v.quando; }).join('\n') + '\nHumor, internet, gíria, meme, tendência, cronicamente online, ironia, quem fala, como falar de pessoas LGBT+.' });
  IDX.push({ k: 'Criar', ic: 'image', title: 'Capas: visual Sóbrio e Pop', to: '#/visual/capas', text: C.skins.sobrio.resumo + '\n' + C.skins.pop.resumo + '\nCor chapada, letra pesada, limão, azul elétrico, lilás.' });
  IDX.push({ k: 'Conversas', ic: 'chat', title: 'Conversas: respostas e cuidados', to: '#/conversas', text: 'Respostas do WhatsApp, avaliações no Google, relato pessoal, comentários, perguntas nos Stories.' });
  IDX.forEach(function (e) { e.f = fold(e.text); e.ft = fold(e.title); });
  return IDX;
}
// Trecho do texto em volta do achado, sem cortar palavra no meio. Devolve [antes, achado, depois].
function trechoBusca(text, pos, len) {
  var a = Math.max(0, pos - 40), b = Math.min(text.length, pos + len + 90);
  while (a > 0 && a < pos && !/\s/.test(text.charAt(a - 1))) a++;
  while (b < text.length && b > pos + len && !/\s/.test(text.charAt(b))) b--;
  function limpa(s) { return s.replace(/\s+/g, ' '); }
  return [(a > 0 ? '…' : '') + limpa(text.slice(a, pos)), text.slice(pos, pos + len), limpa(text.slice(pos + len, b)).replace(/\s+$/, '') + (b < text.length ? '…' : '')];
}
function scrBusca(args) {
  var q0 = args[0] || ''; // o roteador já decodificou
  var inp = h('input', { class: 'campo busca-i', type: 'search', id: 'q', placeholder: 'Buscar: bio, feriado, CRP, voz, limites…', autocomplete: 'off', enterkeyhint: 'search', value: q0, 'aria-label': 'Buscar no app' });
  var out = h('div', { class: 'busca-o', 'aria-live': 'polite' });
  var root = tela('Buscar', [h('div', { class: 'campo-g' }, inp), out]);
  var timer = 0;
  function run() {
    var q = fold(inp.value.trim());
    clear(out);
    if (q.length < 2) { out.appendChild(P('Digite pelo menos duas letras. A busca olha capítulos, pautas, tarefas e as telas de Criar e Conversas.', 'muted')); return; }
    var res = [];
    indice().forEach(function (e) {
      var i = e.f.indexOf(q), it = e.ft.indexOf(q);
      if (i < 0 && it < 0) return;
      res.push({ e: e, score: (it > -1 ? 2 : 0) + (i > -1 ? 1 : 0), pos: i });
    });
    res.sort(function (a, b) { return b.score - a.score; });
    if (!res.length) { out.appendChild(vazio('Nada encontrado', 'Tente outra palavra, sem se preocupar com acentos.')); return; }
    out.appendChild(h('p', { class: 'muted pequeno', text: plural(res.length, 'resultado', 'resultados') + (res.length > 40 ? ', mostrando 40' : '') }));
    var ul = h('ul', { class: 'lista' });
    res.slice(0, 40).forEach(function (r) {
      var e = r.e, snip = null;
      if (r.pos > -1) {
        var t = trechoBusca(e.text, r.pos, q.length);
        snip = [' ', t[0], h('mark', { class: 'busca-m', text: t[1] }), t[2]];
      }
      ul.appendChild(h('li', null, h('a', { class: 'linha', href: e.to }, h('span', { class: 'linha-ic' }, ic(e.ic)), h('span', { class: 'linha-c' }, h('strong', { text: e.title }), h('small', { class: 'busca-s' }, e.k + (snip ? '.' : ''), snip)), ic('chev-r', 'go'))));
    });
    out.appendChild(ul);
  }
  inp.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 120); });
  run();
  return { title: 'Buscar', tab: 'mais', back: '#/mais', backLabel: 'Mais', node: root, focusEl: inp };
}

/* ---------- AJUSTES ---------- */
// Tema: automático segue o aparelho; claro/escuro forçam a escolha (e a cor da barra do navegador).
function aplicarTema() {
  var t = S.st.theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  $$('meta[name="theme-color"]').forEach(function (m) {
    if (!m.dataset.c0) { m.dataset.c0 = m.getAttribute('content'); m.dataset.m0 = m.getAttribute('media') || ''; }
    if (t === 'light' || t === 'dark') { m.setAttribute('content', t === 'dark' ? '#1B0A15' : '#FFF4F8'); m.removeAttribute('media'); }
    else { m.setAttribute('content', m.dataset.c0); if (m.dataset.m0) m.setAttribute('media', m.dataset.m0); }
  });
}
function scrAjustes() {
  var root = tela('Ajustes');
  if (!S.persistent()) root.appendChild(nota('alerta', P('Este navegador não está guardando o que é marcado (modo privado ou armazenamento bloqueado). O app funciona, mas o progresso some ao fechar.'), 'Progresso não salvo'));
  // perfil
  var pf = h('div');
  pf.appendChild(chavePerfil(S.st.perfil, function (id) {
    if (id === S.st.perfil) return;
    aplicaPerfil(id);
    toast('Perfil ' + C.papeis[id].nome + '.');
  }));
  pf.appendChild(descPerfis());
  pf.appendChild(notaPerfil());
  root.appendChild(sec('Perfil', pf, { sub: 'Quem está usando este aparelho. O botão de vidro no alto da tela também troca.' }));
  root.appendChild(h('ul', { class: 'lista lista-s' }, linhaLink('#/visual/voz', 'wave', 'Voz dos posts e visual das capas', 'Agora: ' + VOZ[vozGlobal()].nome + ', visual ' + skin().nome)));
  // data de início
  var din = h('input', { class: 'campo', type: 'date', id: 'inicio', value: S.st.start });
  var aviso = h('p', { class: 'balao-n' });
  function chk() { var d = fromISO(S.st.start); aviso.textContent = d.getDay() === 1 ? 'Começa numa segunda-feira, como o plano pede.' : 'Atenção: o plano foi pensado para começar numa segunda-feira (hoje: ' + DOWL[d.getDay()] + ').'; }
  din.addEventListener('change', function () { if (!din.value) return; S.st.start = din.value; S.save(); chk(); toast('Datas das pautas atualizadas.'); });
  root.appendChild(sec('Quando o plano começa', [P('Mude a data inicial para deslocar as 24 pautas. Escolha uma segunda-feira.', 'muted'), h('div', { class: 'campo-g' }, h('label', { for: 'inicio', text: 'Data de início' }), din), aviso]));
  chk();
  // tema
  var tema = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Aparência' });
  [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].forEach(function (x) {
    tema.appendChild(h('button', { class: 'seg-b', type: 'button', role: 'radio', 'data-id': x[0], 'aria-checked': String(S.st.theme === x[0]), tabindex: S.st.theme === x[0] ? '0' : '-1', onclick: function () { S.st.theme = x[0]; S.save(); aplicarTema(); pintaRadio(tema, S.st.theme); } }, x[1]));
  });
  setasRadio(tema);
  root.appendChild(sec('Aparência', tema));
  // backup
  var ta = h('textarea', { class: 'campo area', id: 'bk', rows: '4', 'aria-label': 'Cole aqui o backup para restaurar', placeholder: 'Cole aqui o backup para restaurar' });
  root.appendChild(sec('Backup do progresso', [
    P('Tudo fica só neste aparelho, inclusive o perfil e a voz escolhida. Para passar para outro celular, copie o backup aqui e cole lá.', 'muted'),
    h('div', { class: 'acoes' }, copyBtn(function () { return S.exportJSON(); }, { label: 'Copiar o backup', kind: 'sec', msg: 'Backup copiado. Guarde em um lugar seguro.' })),
    h('div', { class: 'campo-g' }, ta),
    h('div', { class: 'acoes' }, btn('Restaurar do texto colado', { kind: 'sec', icon: 'refresh', onclick: function () {
      try { S.importJSON(ta.value.trim()); toast('Backup restaurado.'); reaplicaEstado(); } catch (e) { toast('Esse texto não é um backup válido.', { ms: 3800 }); }
    } }))
  ]));
  root.appendChild(sec('Recomeçar', [P('Apaga etapas, tarefas e registros deste aparelho. A data de início volta para 19/10/2026. O perfil e a voz escolhida ficam.', 'muted'),
    h('div', { class: 'acoes' }, btn('Apagar o progresso', { kind: 'perigo', icon: 'trash', onclick: function () { if (window.confirm('Apagar todo o progresso deste aparelho? Não dá para desfazer.')) { S.reset(); toast('Progresso apagado.'); reaplicaEstado(); } } }))]));
  root.appendChild(sec('Sobre', [P('Divã, versão ' + C.versao + '. Material de planejamento; revisão e publicação sob responsabilidade profissional da Letícia.', 'muted pequeno'), P('Fonte dos títulos: Fraunces (licença OFL 1.1).', 'muted pequeno')]));
  return { title: 'Ajustes', tab: 'mais', back: '#/mais', backLabel: 'Mais', node: root };
}

/* ===== roteador e inicialização ===== */
var ROUTES = {
  hoje: scrHoje, posts: scrPosts, pauta: scrPauta, pronta: scrPronta, tarefa: scrTarefa,
  perfis: scrPerfis, visual: scrVisual, conversas: scrConversas, mais: scrMais,
  guia: function (a) { return a[0] ? scrCapitulo(a) : scrGuia(a); },
  anuncios: scrAnuncios, medir: scrMedir, etica: scrEtica, prompts: scrPrompts, rotina: scrRotina,
  revisao: scrRevisao, instalar: scrInstalar, fontes: scrFontes, fonte: scrFonte, busca: scrBusca, ajustes: scrAjustes
};
// key: tela atual · prev: tela anterior · scrolls: posição de rolagem de cada tela · day: dia em que a tela foi montada
// tab: aba marcada agora · origem: última aba “raiz” visitada (as telas sem aba própria voltam para ela)
var NAV = { key: null, prev: null, scrolls: {}, day: null, tab: null, origem: null };

function parseHash() {
  var raw = (location.hash || '').replace(/^#\/?/, '');
  var parts = raw ? raw.split('/') : [];
  parts = parts.map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
  return { name: parts[0] || 'hoje', args: parts.slice(1), key: '#/' + (raw || 'hoje') };
}

function erroTela(e) {
  return {
    title: 'Erro', tab: 'hoje',
    node: tela('Algo deu errado', [
      P('Não consegui abrir esta página. Volte para Hoje e tente de novo.'),
      h('div', { class: 'acoes' }, btn('Ir para Hoje', { href: '#/hoje', kind: 'primary' })),
      h('p', { class: 'muted pequeno', text: String((e && e.message) || e) })
    ])
  };
}

function barBorder() { var b = $('#bar'); if (b) b.classList.toggle('on', window.scrollY > 4); }

function render(o) {
  o = o || {};
  var r = parseHash(), fn = ROUTES[r.name], scr;
  try { scr = fn ? fn(r.args) : naoEncontrado('Esse endereço não existe.'); }
  catch (e) { if (window.console) console.error(e); scr = erroTela(e); }
  var main = $('#main');
  clear(main);
  main.appendChild(scr.node);
  document.title = (scr.title ? scr.title + ' – ' : '') + 'Divã';
  NAV.tab = scr.tab;
  $$('#tabs a').forEach(function (a) {
    if (a.dataset.tab === scr.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (ehRaiz(r.name)) NAV.origem = r.name;
  var back = $('#bar-back'), brand = $('#bar-brand');
  if (scr.back) {
    back.hidden = false; brand.hidden = true;
    $('#bar-back-l').textContent = scr.backLabel || 'Voltar';
    back.setAttribute('data-to', scr.back);
  } else {
    back.hidden = true; brand.hidden = false; back.removeAttribute('data-to');
  }
  NAV.key = r.key;
  NAV.day = isoOf(today());
  if (o.restore) window.scrollTo(0, NAV.scrolls[r.key] || 0);
  else if (!o.keepScroll) window.scrollTo(0, 0);
  barBorder();
  if (!o.initial) {
    var f = scr.focusEl || $('#h1');
    if (f) { try { f.focus({ preventScroll: true }); } catch (e2) { f.focus(); } }
  }
}

function onNav() {
  NAV.scrolls[NAV.key] = window.scrollY;
  NAV.prev = NAV.key;
  var voltando = !!(history.state && history.state.gl === 1); // entrada já visitada: voltar ou avançar
  render({ restore: voltando });
  try { history.replaceState({ gl: 1 }, ''); } catch (e) { /* sem histórico: segue */ }
}

/* ----- barra, abas e atalhos ----- */
$('#bar-back').addEventListener('click', function () {
  var to = this.getAttribute('data-to');
  if (to && NAV.prev === to) history.back();
  else if (to) location.hash = to;
  else history.back();
});
$('#tabs').addEventListener('click', function (e) {
  var a = e.target && e.target.closest ? e.target.closest('a') : null;
  if (a && a.getAttribute('href') === NAV.key) {
    e.preventDefault();
    var calmo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: calmo ? 'auto' : 'smooth' });
  }
});
window.addEventListener('scroll', barBorder, { passive: true });
window.addEventListener('hashchange', onNav);
// Troca o cumprimento quando a hora muda com o app aberto (sem redesenhar a tela).
function atualizaSaudacao() {
  var t = $('#h1[data-nome]');
  if (!t) return;
  var novo = saudacao() + ', ' + t.getAttribute('data-nome');
  if (t.textContent !== novo) t.textContent = novo;
}
setInterval(atualizaSaudacao, 30000);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  atualizaSaudacao();
  // virou o dia com o app aberto: a “próxima pauta” e o “hoje” do mapa mudam
  if (NAV.day && NAV.day !== isoOf(today())) render({ keepScroll: true, initial: true });
});

/* ----- instalar como app ----- */
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredInstall = e;
  if (NAV.key === '#/instalar') render({ keepScroll: true, initial: true });
});
window.addEventListener('appinstalled', function () {
  deferredInstall = null;
  toast('App instalado. Procure o ícone rosa na tela inicial.', { ms: 5000 });
});

/* ----- uso sem internet e atualização ----- */
function iniciaSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  var tinha = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!tinha) { tinha = true; return; } // primeira instalação: nada a avisar
    toast('Versão nova pronta.', { action: 'Atualizar', onAction: function () { location.reload(); }, ms: 15000 });
  });
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') reg.update().catch(function () { /* sem internet: segue */ });
    });
  }).catch(function () { /* sem service worker o app continua funcionando online */ });
}
window.addEventListener('load', iniciaSW);

/* ----- partida ----- */
aplicarTema();
renderTabs();
montaPill();
render({ initial: true });
try { history.replaceState({ gl: 1 }, ''); } catch (e) { /* sem histórico: segue */ }
garantePerfil(); // primeira vez neste aparelho: abre a escolha entre Jean e Letícia

})();
</script>
