0 caracteres","Endereço, horários e modalidades estão corretos"],"copy":[{"label":"Descrição nova","ref":["textos",0],"max":750,"nota":"O Google aceita até 750 caracteres e não permite links nem HTML nesse campo [4]."}],"done":"A descrição nova aparece na ficha, sem erro.","chapters":["textos","ficha"]},{"id":"destaques","stage":"dias1","title":"Dar nome aos destaques","short":"Dar nome aos destaques","when":"Dias 1 a 3","who":"Letícia","min":15,"problem":"Hoje os destaques aparecem identificados só por emojis. Quem chega ao perfil precisa adivinhar o que há em cada um.","before":{"label":"Hoje","text":"Emojis, sem nome."},"after":{"label":"Depois","text":"Comece aqui, Terapia, Dúvidas, Consultório e Contato."},"why":"Nomes claros funcionam como menu do perfil: a pessoa vai direto ao que procura, sem interpretar símbolos.","steps":["⟦No seu perfil|No perfil dela⟧, toque e segure um destaque e escolha Editar destaque.","Troque o nome por um dos cinco abaixo.","Deixe os destaques nesta ordem: Comece aqui, Terapia, Dúvidas, Consultório, Contato.","Em cada um, deixe só o que combina com o nome."],"checks":["Todos os destaques têm nome","A ordem começa por “Comece aqui”","Nenhum destaque mostra pessoas atendidas, agenda, documentos ou telas de mensagens"],"copy":[{"label":"Nomes dos destaques","text":"Comece aqui\nTerapia\nDúvidas\nConsultório\nContato","plain":true,"nocount":true}],"actions":[{"label":"Ver o que cada destaque guarda","href":"#/perfis/instagram"}],"done":"Quem abre o perfil entende cada destaque sem tocar nele.","chapters":["auditoria","textos"]},{"id":"ficha-google","stage":"dias1","title":"Conferir a ficha do Google, campo por campo","short":"Conferir a ficha do Google","when":"Dias 1 a 3","who":"Letícia","min":20,"problem":"A ficha é o que aparece quando alguém pesquisa ⟦o seu nome|o nome dela⟧ ou “psicóloga em Campo Grande”. Sete campos precisam estar corretos e iguais ao que está no Instagram.","why":"Nome, endereço, serviços e contato diferentes entre os lugares fazem a pessoa duvidar. O Google também considera relevância, distância e destaque na busca local, e ninguém garante a primeira posição [6].","steps":["Entre com a conta proprietária e abra a ficha.","Passe pelos sete campos da lista abaixo, um de cada vez.","Corrija o que estiver diferente da realidade.","Peça a uma pessoa de confiança para percorrer o caminho: ficha, telefone, Instagram e link."],"checksTabela":["ficha",0],"copy":[{"label":"Texto curto para a ficha","ref":["ficha",0]}],"notas":[{"kind":"alerta","title":"Avaliações","text":"Não ofereça recompensa por avaliação, não peça relatos de evolução e não reproduza depoimentos em peças. Se responder uma avaliação, não confirme que a pessoa foi paciente [7]."}],"actions":[{"label":"Ver os textos do Google","href":"#/perfis/google"}],"done":"Os sete campos estão conferidos e iguais ao que está no Instagram.","chapters":["ficha","google"]},{"id":"google-links","stage":"semana1","title":"Conferir os links da ficha","short":"Conferir os links da ficha","when":"Dias 3 a 7","who":"Letícia e Jean","min":10,"problem":"No print, o Instagram @leticia_alves_psicologa, de outra profissional, aparece ao lado da ⟦sua ficha|ficha da Letícia⟧. Isso não prova que a conta dela esteja ligada à ⟦sua ficha|ficha da Letícia⟧. Por isso o primeiro passo é conferir o que a ficha mostra.","why":"Se a ficha apontar para o perfil errado, quem clica chega à pessoa errada. Um link certo é a correção mais rápida, e depende só de quem administra a ficha [3].","stepsRef":["google","Trilha 1 • Conferir os links da ficha"],"copy":[{"label":"⟦Seu Instagram|Instagram da Letícia⟧, para cadastrar na ficha","text":"https://www.instagram.com/psi.leticia_alves/","plain":true,"nocount":true}],"done":"A ficha mostra só ⟦o seu Instagram|o Instagram da Letícia⟧ e o link certo de contato.","chapters":["google","ficha"]},{"id":"cadastros","stage":"semana1","title":"Conferir cadastros antigos","short":"Conferir cadastros antigos","when":"Dias 3 a 7","who":"Letícia e Jean","min":15,"problem":"A página pública do MundoPsicólogos, com ⟦o seu CRP|o CRP da Letícia⟧, aponta para @psi.lleticiaalves e para o endereço Pedro Celestino, 2017. O print atual mostra Alexandre Fleming, 873. São sinais diferentes e merecem conferência [8].","why":"Dados diferentes entre os lugares confundem quem pesquisa. Isso não prova que o cadastro antigo seja o motivo de a outra Letícia aparecer na busca.","stepsRef":["google","Trilha 2 • Fortalecer a identidade nas buscas"],"notas":[{"kind":"alerta","title":"Não faça","text":"Não denuncie o perfil da outra profissional como se fosse falso. Não acrescente palavras-chave ao nome da empresa só para aparecer mais [5][6]."}],"done":"Instagram e endereço estão iguais em todos os cadastros que ⟦você consegue acessar|for possível acessar⟧.","chapters":["google","auditoria"]},{"id":"modelos-canva","stage":"semana1","title":"Criar os três modelos no Canva","short":"Criar os três modelos no Canva","when":"Semana 1","who":"Letícia","min":60,"problem":"As capas atuais misturam fotos quentes, textos pequenos e estilos variados, e a leitura no celular oscila. Três modelos fixos tiram a decisão de design de cada post.","why":"Com os modelos prontos, cada pauta vira “duplicar e trocar o texto”. A capa fica reconhecível e o rodapé com nome e CRP continua legível.","stepsRef":["canva","Receita de montagem"],"checks":["Arquivo de 1080 × 1350 px, com margem de 80 px","Modelos A (creme), B (ameixa) e C (sálvia) criados","Rodapé com nome e CRP legível no celular (36 px ou mais no arquivo)","Pastas criadas: Modelos, Em revisão, Aprovados e Publicados"],"notas":[{"kind":"info","title":"Fontes no Canva","text":"Comece com Lora nos títulos e Montserrat no texto, se estiverem ⟦na sua conta|na conta dela⟧. Use no máximo duas famílias."}],"actions":[{"label":"Ver as três capas","href":"#/visual/capas"},{"label":"Ver as cores","href":"#/visual/cores"}],"done":"Os três modelos estão salvos na pasta Modelos e o rodapé é legível no celular.","chapters":["canva","cores"]},{"id":"fixados","stage":"semana1","title":"Preparar os três posts fixados","short":"Preparar os três posts fixados","when":"Semana 1","who":"Letícia","min":45,"problem":"Quem chega ao perfil vê primeiro os posts fixados. Os três precisam responder: quem ⟦você atende|ela atende⟧, como funciona começar e como pedir informações.","why":"É a conversa que a pessoa teria com ⟦você|ela⟧ antes de escrever. Respondida no perfil, a primeira mensagem chega mais tranquila.","steps":["Abra a peça pronta P01, “Quem eu atendo”, e revise com as sete perguntas.","Faça o mesmo com a P02, o Reel “A primeira sessão”, e com a P03, “Como pedir informações”.","Monte as capas com o modelo C, o de processo.","Publique os três e fixe-os no perfil."],"checks":["P01 revisada e publicada","P02 revisada e publicada","P03 revisada e publicada","Os três estão fixados"],"actions":[{"label":"Peça pronta P01","href":"#/pronta/P01"},{"label":"Peça pronta P02","href":"#/pronta/P02"},{"label":"Peça pronta P03","href":"#/pronta/P03"}],"done":"Os três posts fixados estão no ar, com nome e CRP legíveis.","chapters":["editorial","prontos1"]},{"id":"whats-respostas","stage":"semana1","title":"Salvar as três respostas do WhatsApp","short":"Salvar as respostas do WhatsApp","when":"Semana 1","who":"Letícia","min":10,"problem":"O guia propõe três respostas para as situações mais comuns de primeiro contato: a entrada, a pergunta sobre valor e a dúvida.","why":"Resposta pronta é resposta calma: sem pressão, sem promessa e sem pedir sintomas.","steps":["Copie cada resposta abaixo.","Se usa o WhatsApp Business, salve como Respostas rápidas. Se não, guarde numa nota do celular.","⟦Ajuste ao seu jeito|Ajuste ao jeito dela⟧, sem acrescentar promessa, escassez ou pedido de detalhes pessoais.","Complete a resposta sobre valor com ⟦os seus honorários reais|os honorários reais dela⟧."],"copy":[{"label":"Mensagem de entrada","ref":["conversao",0]},{"label":"Quando perguntarem o valor","ref":["conversao",1],"nota":"Depois, informe os honorários reais e as condições. Não esconda o preço para forçar uma conversa longa."},{"label":"Pessoa ainda em dúvida","ref":["conversao",2]}],"notas":[{"kind":"alerta","title":"Limites","text":"Sem escassez inventada, sem pressão emocional, sem diagnóstico por mensagem e sem pedir sintomas para “qualificar” um contato."}],"done":"As três respostas estão salvas e a do valor tem ⟦os seus números|os números dela⟧.","chapters":["conversao"]},{"id":"rotina-agenda","stage":"rotina","title":"Reservar os seis blocos da semana","short":"Reservar os seis blocos da semana","when":"Semana 2","who":"Letícia","min":10,"problem":"Plano sem horário marcado não acontece. A rotina do guia soma 3 horas por semana, em seis blocos.","why":"Os blocos têm uma ordem: escolher, redigir, montar, gravar, publicar e medir. Marcados na agenda, cada um tem hora e alarme.","steps":["Veja os seis blocos em Mais, Rotina.","Escolha os dias e horários em que cada bloco cabe ⟦na sua semana|na semana dela⟧.","Coloque os blocos na agenda do celular, com alarme.","Nas duas primeiras semanas, reserve tempo extra para criar os modelos."],"notas":[{"kind":"info","title":"Modo mínimo","text":"Se a semana apertar, mantenha 1 conteúdo educativo e 1 sobre funcionamento. Não dobre o volume na semana seguinte para compensar."}],"actions":[{"label":"Abrir a rotina da semana","href":"#/rotina"}],"done":"Os seis blocos estão ⟦na sua agenda|na agenda dela⟧.","chapters":["rotina"]},{"id":"linha-base","stage":"rotina","title":"Registrar a linha de base","short":"Registrar a linha de base","when":"Semana 2","who":"Letícia","min":10,"problem":"Sem ponto de partida não dá para saber se algo melhorou. O print do Google mostra 233 interações, mas sem período e sem dizer quantas viraram consulta, então não serve como base.","why":"O que orienta decisões é a procura compatível que chega à primeira sessão, e não seguidores nem curtidas.","steps":["Abra Medir e escolha a semana 1.","Anote os totais da semana: conversas novas, compatíveis, agendadas, realizadas e gasto. Use zero se não houve anúncio.","Pergunte a cada pessoa nova: “Como você conheceu meu trabalho?” e anote só o canal, sem nome.","Repita toda semana, em uns 15 minutos."],"notas":[{"kind":"alerta","title":"Sem dados de pacientes","text":"Só números totais. Nada de nome, orientação sexual, identidade, sintomas ou conteúdo de sessão."}],"actions":[{"label":"Abrir Medir","href":"#/medir"}],"done":"A semana 1 tem registro, mesmo que todos os números sejam zero.","chapters":["metricas"]},{"id":"acompanhar-busca","stage":"rotina","title":"Buscar ⟦o seu nome|o nome da Letícia⟧ em 7, 14 e 30 dias","short":"Buscar ⟦o seu nome|o nome da Letícia⟧ em 7, 14 e 30 dias","when":"Semana 2 e depois","who":"Letícia e Jean","min":5,"problem":"A correção dos links e dos cadastros não aparece de um dia para o outro. Sem registrar, não dá para saber se funcionou.","why":"É a forma de saber, com datas, se a identidade nas buscas melhorou. Os prazos são janelas de acompanhamento, não promessas.","steps":["Anote a data de hoje.","Pesquise o identificador exato do Instagram, o nome com o CRP e o nome com Campo Grande.","Repita em 7, 14 e 30 dias, no mesmo tipo de aparelho e de lugar.","Compare Busca e Maps: os dois podem mostrar resultados diferentes."],"notas":[{"kind":"info","title":"Sem prazo prometido","text":"7, 14 e 30 dias são janelas de acompanhamento, e não prazo de correção. Ninguém garante a primeira posição [5][6]."}],"done":"⟦Você tem|Há⟧ três datas anotadas, com o que apareceu em cada busca.","chapters":["google"]},{"id":"anuncio-condicoes","stage":"anuncio","title":"Conferir as condições do teste pago","short":"Conferir as condições do teste pago","when":"Semanas 3 e 4","who":"Jean, com revisão da Letícia","min":15,"problem":"Anúncio só entra depois que o básico funciona. Com verba pequena, o guia sugere testar um único canal, começando pela Pesquisa do Google.","why":"Sem destino claro, agenda e limite de gasto, o dinheiro paga cliques que não viram atendimento.","steps":["Marque abaixo cada condição que já está pronta.","Se alguma faltar, resolva antes e volte aqui.","Só então abra a aba Google ou Meta, em Anúncios."],"checksRef":["ads","Condições para abrir o teste"],"checkKey":"ads","notas":[{"kind":"alerta","title":"Nada foi publicado","text":"Nenhuma campanha foi criada ou ativada. A aprovação de um anúncio depende também da conta, do destino e da análise da plataforma."}],"actions":[{"label":"Abrir Anúncios","href":"#/anuncios"}],"done":"As cinco condições estão marcadas, ou a decisão foi esperar.","chapters":["ads","googleads"]},{"id":"anuncio-limite","stage":"anuncio","title":"Definir o limite de gasto antes de começar","short":"Definir o limite de gasto","when":"Semanas 3 e 4","who":"Letícia e Jean","min":10,"problem":"Sem teto definido antes, o gasto vira surpresa. O exemplo do guia usa R$ 600 como suposição para ilustrar, e não como valor recomendado.","why":"O teto é o ponto de parada: ao chegar nele, ⟦você revisa|a Letícia e o Jean revisam⟧ antes de gastar mais.","steps":["⟦Decida um valor que você pode gastar inteiro como teste.|Combine com a Letícia um valor que ela possa gastar inteiro como teste.⟧","Escolha a data de revisão do teste.","Calcule o orçamento diário médio e quantos cliques a verba paga, em Anúncios, aba Contas.","Registre o limite, a data e quem aprova, antes de gastar."],"notas":[{"kind":"info","title":"Não aumente só porque o clique ficou barato","text":"Para escalar é preciso haver procura compatível e agenda para atender."}],"actions":[{"label":"Abrir as contas","href":"#/anuncios/contas"}],"done":"Limite, data de revisão e responsável estão anotados.","chapters":["anunciosgoogle","metricas"]}],"prontas":["P01","P02","P03"],"seteperguntas":["A peça tem uma ideia e o público aparece com clareza?","O texto descreve possibilidades sem diagnosticar quem lê?","Algum dado, credencial ou caso foi inventado pela IA?","Há nome profissional e CRP legíveis na identificação da peça?","Uma pessoa consegue ler a capa no celular sem ampliar?","O convite é adequado à sensibilidade do tema?","O contato funciona e a agenda comporta a procura?"],"auxTitles":["Revisar o que a IA escreveu","Montar no Canva a partir do texto","Nova ideia fora do calendário"],"atalhos":[{"label":"Bio do Instagram","icon":"chat","ch":"textos","i":2},{"label":"Descrição do Google","icon":"pin","ch":"textos","i":0},{"label":"Link do WhatsApp","icon":"send","ch":"textos","i":3},{"label":"Mensagem de entrada","icon":"chat","ch":"conversao","i":0},{"label":"Nome do perfil","icon":"users","ch":"textos","i":1},{"label":"Resposta sobre valor","icon":"chat","ch":"conversao","i":1}],"reelEstrutura":[{"t":"0–3 s","d":3,"f":"Abrir a questão","o":"Uma frase específica, sem apresentação longa."},{"t":"3–15 s","d":12,"f":"Desenvolver","o":"Explique o contexto em linguagem cotidiana."},{"t":"15–25 s","d":10,"f":"Dar um exemplo","o":"Situação ilustrativa, nunca relato de paciente disfarçado."},{"t":"25–30 s","d":5,"f":"Mudar o ritmo","o":"Troque enquadramento, cartão de texto ou pergunta de reflexão."},{"t":"30–45 s","d":15,"f":"Fechar com nuance","o":"Uma síntese útil e um convite coerente."}],"safe":{"topo":14,"base":35,"lado":6},"fotos":{"usar":["Retratos reais da Letícia","Sala sem pessoas atendidas","Cenas do dia a dia, sem encenar paciente","Imagens externas com licença conferida e sem estereótipo"],"evitar":["Pessoas chorando para “representar” o público LGBT+","Horários, notificações, vozes ou prontuários aparecendo","Pessoas atendidas ou objetos identificáveis na ficha do Google","Foto atrás do texto no modelo B, que é sem foto"]},"perfis":{"nomeNota":"O nome mantém o recorte que já aparecia no perfil. Teste no campo: o limite de caracteres varia nas fontes que li (30 em sites de terceiros) e não foi confirmado pelo Instagram.","nomeCurto":{"text":"Letícia Alves | Psicóloga","nota":"25 caracteres. Deixe “mulheres e LGBT+” na bio."},"destaques":[{"n":"Comece aqui","d":"Quem ⟦você atende|ela atende⟧ e como funciona começar."},{"n":"Terapia","d":"O que é psicoterapia e como o cuidado acontece."},{"n":"Dúvidas","d":"Perguntas comuns antes da primeira sessão."},{"n":"Consultório","d":"O espaço e como chegar, sem pessoas atendidas."},{"n":"Contato","d":"Como pedir informações e agendar."}],"fixados":[{"id":"P01","t":"Quem eu atendo"},{"id":"P02","t":"Como funciona começar"},{"id":"P03","t":"Como pedir informações"}]},"copyLabels":{"posicionamento:0":"Frase-eixo da comunicação","textos:0":"Descrição do Google","textos:1":"Nome do Instagram","textos:2":"Bio do Instagram","textos:3":"Link do WhatsApp","ficha:0":"Texto curto para a ficha","ficha:1":"Resposta a uma avaliação","conversao:0":"Mensagem de entrada","conversao:1":"Quando perguntarem o valor","conversao:2":"Pessoa ainda em dúvida","reels:0":"Exemplo de gancho com continuidade","prompts:0":"Prompt de revisão","prompts:1":"Prompt para montar no Canva","prompts:2":"Prompt para uma nova ideia"},"limits":{"textos:0":{"max":750},"textos:2":{"max":150}},"chapterNotes":{"reels":[{"kind":"alerta","title":"Ajuste do app","text":"No guia original, “15–25 s” e “20–30 s” se sobrepõem. No app, em Criar, Reels, as etapas seguem em sequência: 0–3, 3–15, 15–25, 25–30 e 30–45 s. A tabela abaixo mantém o texto original."}],"cores":[{"kind":"info","title":"O rosa é só do app","text":"Esta paleta é a do visual Sóbrio das capas do Instagram. O rosa do app e do ícone não muda as capas. Para um visual mais vivo, veja o Pop online em Criar, Capas."}],"canva":[{"kind":"info","title":"Rodapé legível","text":"O guia não define o tamanho do rodapé com nome e CRP. Use 36 px ou mais no arquivo de 1080 px, cerca de 13 px na tela do celular. É uma recomendação do app."}]},"guiaGrupos":[{"t":"Entender o caso","d":"Decisões, diagnóstico, mercado e linguagem.","ids":["inicio","auditoria","mercado","posicionamento"]},{"t":"Montar os perfis","d":"Textos do Instagram e do Google, ficha e contato.","ids":["textos","google","ficha","conversao"]},{"t":"Produzir o conteúdo","d":"Calendário editorial, rotina, cores, Canva e Reels.","ids":["editorial","rotina","cores","canva","reels"]},{"t":"Anúncios e números","d":"Google Ads, Meta Ads e métricas.","ids":["ads","googleads","anunciosgoogle","meta","metricas"]},{"t":"Plano e ética","d":"Ações dos 90 dias e limites da divulgação.","ids":["actionplan","etica"]},{"t":"Prompts e peças prontas","d":"Como usar a IA e três peças já escritas.","ids":["prompts","prontos1","prontos2","prontos3","calendario"]},{"t":"Evidências","d":"Fontes e limites da pesquisa.","ids":["fontes"]}],"review":{"intro":"Revisei duas coisas: o que o guia sugere produzir (posts, Reels, Stories, capas e textos do Google) e o próprio guia como plataforma (HTML, PDF e TXT). Cada ponto diz o que encontrei, por que importa e como resolver. O rótulo mostra se já foi resolvido no app, se há uma decisão a tomar ou se é uma tarefa a fazer.","producoes":[{"id":"rodape","sev":"alta","status":"app","t":"O rodapé com nome e CRP ficava pequeno demais","found":"O guia não diz o tamanho do rodapé. O esquema de capa desenhado nele mostrava esse texto com 8 px, o que equivale a cerca de 28 px num arquivo de 1080 px de largura.","why":"No celular o post aparece com uns 390 px de largura. Os 28 px do arquivo viram cerca de 10 px na tela, abaixo do que se lê sem ampliar. O próprio guia pergunta se a capa pode ser lida no celular sem ampliar.","fix":"Os modelos do app usam rodapé de 36 px ou mais (cerca de 13 px no celular) e mostram a capa no tamanho real do feed. No Canva, use 36 px ou mais e confira exportando e abrindo no celular.","link":["Ver as capas","#/visual/capas"]},{"id":"reel-faixas","sev":"media","status":"app","t":"As faixas de tempo do Reel se sobrepunham","found":"Na estrutura do vídeo, “15–25 s” (dar um exemplo) e “20–30 s” (mudar o ritmo) ocupam os mesmos segundos.","why":"Quem grava não sabe se o exemplo termina em 20 s ou em 25 s.","fix":"No app as cinco etapas seguem em sequência: 0–3, 3–15, 15–25, 25–30 e 30–45 s. A mudança de ritmo ficou em 25–30 s, entre o exemplo e o fechamento. É um ajuste do app; o texto original continua em Guia, Reels.","link":["Ver a estrutura do Reel","#/visual/reels"]},{"id":"reel-p02","sev":"media","status":"decidir","t":"A abertura do Reel P02 tem mais palavras do que cabem em 3 segundos","found":"A primeira fala do roteiro pronto tem 10 palavras para 3 segundos, ou 3,3 palavras por segundo. As outras quatro falas ficam entre 1,8 e 2,4.","why":"Fala corrida deixa a legenda difícil de acompanhar e a voz apressada, logo no começo do vídeo. O app avisa acima de 3 palavras por segundo; essa é uma regra do app, não de uma fonte oficial.","fix":"Encurte a frase ou dê 4 segundos à abertura. Uma opção: “Você não precisa chegar com tudo organizado.” (7 palavras). O texto na tela, “Preciso saber o que dizer?”, já dá o contexto da primeira sessão. A decisão é da Letícia.","link":["Ver o roteiro do P02","#/pronta/P02"]},{"id":"feriados","sev":"media","status":"app","t":"Duas pautas caem em feriado nacional","found":"Com início em 19/10/2026, P07 na segunda, 02/11 (Finados) e P15 na sexta, 20/11 (Consciência Negra). O calendário original não marcava feriados.","why":"O uso do celular muda em feriado e o tema pode não combinar com o dia. Não tenho dados do perfil da Letícia para dizer quanto muda.","fix":"O app avisa na pauta e no mapa das 8 semanas. Dá para publicar na véspera ou no dia seguinte sem desmontar o plano. Feriados estaduais e municipais não entram na conta: confira o calendário de Campo Grande.","link":["Ver as pautas","#/posts"]},{"id":"areia","sev":"media","status":"app","t":"Uma cor da paleta não serve como texto","found":"Das sete cores, só a areia falha em contraste: 1,8:1 sobre creme e 2,0:1 sobre branco. O guia avisa para evitar “texto pequeno sobre branco”.","why":"O mínimo é 4,5:1 para texto comum e 3:1 para texto grande [19]. A areia não passa nem como texto grande, então o aviso de “pequeno” fica curto.","fix":"Use a areia só em linhas, ícones e formas. As combinações que o guia indica (café sobre creme, creme sobre ameixa, verde escuro sobre sálvia) ficam entre 6,3:1 e 12,2:1. A aba Cores calcula cada par.","link":["Ver os pares de cor","#/visual/cores"]},{"id":"nome-ig","sev":"media","status":"fazer","t":"O nome do perfil pode não caber no campo","found":"O nome sugerido tem 45 caracteres. Dois sites de terceiros dizem que o campo Nome do Instagram aceita 30, e outras fontes que conheço falam em mais. Não consegui confirmar o número na Central de Ajuda do Instagram. Confiança baixa.","why":"Se o campo cortar, o nome fica pela metade no perfil e nas buscas.","fix":"Cole o nome no campo e veja se aceita. Se cortar, use a versão curta, “Letícia Alves | Psicóloga” (25 caracteres), e deixe “mulheres e LGBT+” na bio.","link":["Ver os textos do Instagram","#/perfis/instagram"]},{"id":"grade","sev":"baixa","status":"fazer","t":"Capas 4:5 e a grade do perfil","found":"O guia usa capas de 1080 × 1350 px (4:5). O Instagram mudou a grade do perfil em 2025, e as duas fontes que li divergem: uma diz que a grade mostra o 4:5 inteiro; outra, que mostra miniaturas 3:4 e corta um pouco das capas 4:5. Não achei a regra na Central de Ajuda. Confiança baixa.","why":"Se as bordas forem cortadas, texto encostado nelas perde letras na grade.","fix":"As margens de 80 px dos modelos já deixam o texto longe das bordas. Publique a P01 e olhe a grade no celular. Se cortar, ajuste só a posição do texto, sem trocar de modelo."},{"id":"slides-curtos","sev":"baixa","status":"decidir","t":"Os slides prontos são mais curtos que a regra do guia","found":"O guia recomenda de 25 a 45 palavras por slide interno. Na P01 os slides internos têm de 21 a 28 palavras; na P03, de 18 a 25.","why":"Não é erro: slide curto lê melhor no celular. Mas a regra e a peça não batem, e isso confunde quem revisa.","fix":"O app mostra a contagem de palavras em cada slide. Se quiser seguir a regra, acrescente um exemplo cotidiano, sem inventar dado. Se preferir manter curto, pode.","link":["Ver a peça pronta P01","#/pronta/P01"]},{"id":"rosa","sev":"baixa","status":"decidir","t":"Rosa no app, outras cores nas capas","found":"Foram pedidos tons de rosa no app e no ícone. As capas dos posts seguem a paleta do guia (creme, café, ameixa, sálvia, verde escuro, terracota) e o guia diz para não reservar rosa a mulheres nem arco-íris a LGBT+.","why":"Misturar as duas coisas mudaria a identidade das capas sem decisão da Letícia. O guia pede que a inclusão apareça no texto, nas imagens e no cuidado, e não na cor.","fix":"O rosa ficou só no app e no ícone. Se a Letícia quiser um visual mais vivo, existe o Pop online, opcional, em Criar, Capas: o rosa entra só em formas de apoio, nunca como cor de um público, e o contraste de cada par está na aba Cores."},{"id":"voz","sev":"media","status":"decidir","t":"O guia propõe uma voz só, sóbria; a Letícia pode preferir outra","found":"Os 24 prompts pedem “português brasileiro natural, direto e acolhedor” e os modelos de capa seguem um visual sóbrio. Foi sugerido que uma linguagem “cronicamente online” da internet brasileira, com tendências, memes e cultura LGBT+, poderia combinar mais com ela. É uma hipótese: só a Letícia sabe como quer soar.","why":"Voz é identidade: se não é dela, vira esforço a cada post e soa forçada. Humor e gíria também aumentam o risco de ferir ou banalizar quem sofre. As orientações de publicidade que li (nota técnica do CFP de 2022 e cartilha do CRP-MG de 2026) pedem conteúdo coerente com a ciência psicológica e sem sensacionalismo, e não tratam de humor, memes ou tendências. Vale a regra geral.","fix":"Em Criar, Voz, há seis vozes, três ajustes finos (humor, internet e quem fala) e a escolha de como ela se coloca ao falar de pessoas LGBT+. A voz entra como um parágrafo a mais no prompt: os limites éticos do prompt original continuam, e nas pautas sobre violência ou risco o app pede tom sóbrio. Com a voz Sóbria, os 24 prompts ficam idênticos ao arquivo original.","link":["Escolher a voz","#/visual/voz"]},{"id":"pop","sev":"baixa","status":"decidir","t":"Uma voz mais online pede capas mais de feed","found":"O guia só traz a paleta sóbria. Com uma voz de internet, essa paleta sozinha pode parecer fora de lugar.","why":"Voz e visual precisam combinar. Mas o guia pede que a inclusão apareça no texto, nas imagens e no cuidado, e não na cor, e que rosa e arco-íris não sejam reservados a públicos.","fix":"O visual Pop online é opcional: cor chapada (tinta, limão, azul e lilás), letra pesada e uma palavra em destaque, com o rosa só em formas de apoio. Os pares de cor foram calculados: 4,5:1 ou mais em todo texto. A escolha também troca o parágrafo de visual dos prompts.","link":["Ver as capas","#/visual/capas"]}],"plataforma":[{"id":"rolagem","sev":"alta","status":"app","t":"Uma página só, com 97 telas de rolagem no celular","found":"No celular (390 × 844 px) o guia em HTML tem 81.598 px de altura. O primeiro botão de copiar só aparece a 6.933 px do topo, depois de umas 8 telas.","why":"Quem abre o guia para copiar a bio precisa procurar. E o que deve ser feito hoje se perde entre 26 capítulos.","fix":"O app abre em Hoje: a próxima pauta e o botão de copiar o prompt já aparecem na primeira tela. O resto fica em cinco áreas por perfil (a Letícia vê Hoje, Posts, Criar, Conversas e Mais; o Jean, Hoje, Perfis, Anúncios, Medir e Mais) e o guia completo continua inteiro em Mais, Guia.","link":["Abrir o guia completo","#/guia"]},{"id":"toque","sev":"alta","status":"app","t":"Botões e links pequenos demais para o polegar","found":"Dos 175 itens clicáveis do HTML original, 142 tinham menos de 44 px de altura ou largura e 78 tinham menos de 24 px. Exemplos: citações [n] com 15 × 14 px, o botão “Copiar texto” com 91 × 38 px, links do sumário com 26 px de altura e filtros em caixas de seleção de 36 px.","why":"O mínimo do WCAG 2.2 é 24 × 24 px, no critério 2.5.8; 44 px é a medida confortável para o polegar. Toque errado vira frustração e desistência.","fix":"No app todo item clicável tem pelo menos 44 px nos dois sentidos, e os testes medem isso no navegador. As citações têm área de toque ampliada e os filtros viraram botões."},{"id":"letra","sev":"media","status":"app","t":"Letra de 11 e 12 px em muitos pontos","found":"O HTML original tem 116 elementos com letra abaixo de 13 px: 26 rótulos de capítulo e 7 códigos de cor com 11 px; 24 etiquetas de pauta, 27 citações, 17 botões de copiar e 8 opções de filtro com 12 px. As células das 25 tabelas ficam em 13 px.","why":"Letra de 11 a 12 px obriga a dar zoom na tela do celular.","fix":"No app nenhum texto fica abaixo de 13 px (medido nos testes), o corpo tem 16 a 17 px e os botões de ação, 15 px ou mais."},{"id":"tabelas","sev":"media","status":"app","t":"Tabelas largas no celular","found":"O guia tem 25 tabelas. No celular, 4 precisam de rolagem para o lado e as outras ficam em colunas apertadas.","why":"Rolar para o lado esconde colunas: a pessoa lê metade da informação sem perceber.","fix":"No app cada linha vira um cartão com os rótulos escritos (“O que entregar”, “O que medir”). Quatro tabelas ganharam formato próprio: pares “Trocar e Por”, contagem de caracteres, slides e linha do tempo do Reel."},{"id":"tres-arquivos","sev":"alta","status":"app","t":"Três arquivos com o mesmo conteúdo e sem ligação entre eles","found":"O guia existia em HTML, em PDF e em um TXT de prompts. O PDF é estático e o TXT obriga a copiar bloco por bloco.","why":"Qualquer correção precisa ser feita três vezes, e as versões acabam divergindo.","fix":"O app reúne tudo numa fonte só: 26 capítulos, 24 pautas e 3 prompts de apoio, extraídos do HTML original. Um teste automático confirma que, com a voz e o visual padrão, os 24 prompts e os 3 de apoio do app são idênticos aos do TXT. Duas frases do guia que mandavam abrir “o guia HTML” e “o arquivo de prompts” foram trocadas por frases que valem no app; o resto do texto segue como no original."},{"id":"perfis","sev":"media","status":"app","t":"Um app só para duas pessoas com tarefas diferentes","found":"O app mostrava tudo na mesma ordem para quem abrisse. O guia divide o trabalho: a Letícia responde por voz, precisão clínica e limites éticos; o Jean organiza arquivos, links, configuração técnica e leitura agregada das métricas.","why":"Quem cuida de anúncios não precisa passar pelo calendário de pautas para chegar às contas, e quem cria não precisa passar pelo orçamento para chegar ao prompt.","fix":"O botão de vidro no topo troca entre Jean e Letícia. Jean: Hoje, Perfis, Anúncios e Medir, com o texto na terceira pessoa. Letícia: Hoje, Posts, Criar, Conversas e Mais. O guia inteiro continua nos dois. Não é senha: o site é público para quem tiver o endereço e o perfil só muda o que aparece.","link":["Abrir Ajustes","#/ajustes"]},{"id":"orcamento-dia","sev":"baixa","status":"app","t":"O guia e a calculadora arredondam o orçamento diário de jeitos diferentes","found":"O guia usa R$ 19,70 por dia e chega a R$ 598,88 no mês de 30,4 dias. A calculadora do app trunca nos centavos: R$ 600 ÷ 30,4 = R$ 19,73 por dia, e R$ 19,73 × 30,4 = R$ 599,79.","why":"Sem explicação, dois números diferentes para a mesma conta parecem erro de um dos lados.","fix":"A calculadora agora mostra uma nota com as duas contas. Nenhuma das duas passa da verba de R$ 600.","link":["Abrir as contas","#/anuncios/contas"]},{"id":"progresso","sev":"media","status":"app","t":"Só havia “publicado”: faltava o caminho até lá","found":"O HTML guardava apenas uma caixa “publicado” por pauta. Não havia etapas intermediárias, tarefas de preparação nem registro de resultados.","why":"O plano de 90 dias tem dependências: identificação e contato, depois modelos, depois rotina, depois anúncios. Sem ver o andamento, é fácil pular a base.","fix":"Cada pauta tem quatro etapas que espelham as pastas do Canva (A fazer, Em revisão, Aprovada, Publicada). As 17 tarefas de preparação têm passo a passo e marcação. Medir guarda o registro semanal.","link":["Ver as tarefas em Hoje","#/hoje"]},{"id":"hoje","sev":"media","status":"app","t":"Organizado como manual, não como “o que faço hoje?”","found":"Os capítulos seguem a ordem de um manual, do 01 ao 24. A pergunta de quem usa é outra: o que eu faço agora?","why":"Quem tem pouco tempo desiste de procurar a próxima ação num texto longo.","fix":"Hoje mostra a próxima pauta, o mapa das 8 semanas e as tarefas por etapa. Cada tarefa traz o problema, o antes e depois, o passo a passo e o texto pronto para copiar."},{"id":"instalar","sev":"media","status":"app","t":"Não dava para instalar e não tinha ícone","found":"O HTML era um arquivo solto, sem manifesto nem ícone, então o celular não o oferecia como app.","why":"Para usar no dia a dia, o plano precisa abrir com um toque, como qualquer app.","fix":"O app é um PWA: instala pela tela inicial (passo a passo em Mais, Instalar), abre sem internet depois da primeira visita e avisa quando há versão nova. O ícone é um Ψ com uma seta para cima, em rosa.","link":["Ver como instalar","#/instalar"]},{"id":"acesso","sev":"baixa","status":"app","t":"Acessibilidade e tema escuro","found":"O original já tinha foco visível, respeito ao “reduzir movimento” e estilo de impressão. Não tinha tema escuro.","why":"Muita gente usa o celular à noite ou com tema escuro ligado; um fundo branco forte cansa.","fix":"O app segue o tema do aparelho e permite escolher em Ajustes. Mantém foco visível, “pular para o conteúdo”, nome em todo botão só de ícone e aviso de mudanças para leitor de tela. Os pares de cor do app foram calculados nos dois temas.","link":["Abrir Ajustes","#/ajustes"]},{"id":"aparelhos","sev":"alta","status":"app","t":"No computador e no tablet, o app era um celular no meio da tela","found":"Até esta versão, qualquer tela mostrava uma coluna de 560 px com as abas embaixo. No Mac sobrava rosa dos dois lados; com o celular deitado, cabeçalho e abas ocupavam um terço da altura.","why":"O Jean cuida dos perfis e anúncios no computador; a Letícia cria no celular. Cada um precisa do app no formato do aparelho que tem na mão.","fix":"O app se ajusta sozinho: celular em pé com abas embaixo; tablet em pé com coluna mais larga; computador e tablet deitado com menu lateral, coluna de leitura e troca de perfil em janela no centro; celular deitado com trilho estreito à esquerda. Com mouse, botões e linhas reagem ao ponteiro. O perfil escolhido fica guardado em cada aparelho. Testado em 8 tamanhos, de 360 px a 1440 px, sem rolagem lateral."},{"id":"publico","sev":"media","status":"decidir","t":"O site no GitHub fica aberto para quem tiver o endereço","found":"No plano gratuito, o GitHub Pages só funciona com repositório público. A página tem marcação para não aparecer em buscas, mas isso não impede que alguém com o endereço abra o app.","why":"O app tem o CRP, o telefone e a análise do caso da Letícia. São dados profissionais e de planejamento. Não há nenhum dado de paciente.","fix":"Use um nome de repositório que não seja óbvio, não divulgue o endereço e confirme com a Letícia que ela concorda. Para ter acesso fechado seria preciso outro plano ou serviço; confira a documentação do GitHub."}],"bom":["Limites éticos em todas as peças: sem promessa, sem “antes e depois” e sem dados de pacientes.","Prompts autossuficientes: cada pauta repete o contexto e funciona em um chat novo.","Uma ideia por peça e um único convite no final.","Textos dentro dos limites: descrição do Google com 600 de 750 caracteres, bio com 122 de 150, títulos de anúncio com até 27 de 30 e descrições com até 84 de 90.","Fontes citadas e limites da pesquisa declarados, com o que não foi medido dito com todas as letras.","Combinações de cor indicadas pelo guia com contraste de 6,3:1 a 12,2:1."],"fontes":[{"t":"W3C, WCAG 2.2: tamanho mínimo de alvo (critério 2.5.8)","u":"https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html","n":"24 × 24 px, nível AA."},{"t":"W3C, WCAG 2.2: contraste mínimo (critério 1.4.3)","u":"https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html","n":"4,5:1 para texto comum e 3:1 para texto grande. É a fonte [19] do guia."},{"t":"GitHub Docs: o que é o GitHub Pages","u":"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages","n":"Plano gratuito: só repositório público."},{"t":"GitHub Docs: criar um site no GitHub Pages","u":"https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site","n":"A publicação pode levar até 10 minutos."},{"t":"Inro, tamanhos de post do Instagram (março de 2026)","u":"https://www.inro.social/blog/instagram-post-size","n":"Terceiros. Diz que a grade usa 3:4 e que o 4:5 é cortado de leve."},{"t":"Hopper HQ, grade vertical do Instagram (março de 2025)","u":"https://help.hopperhq.com/en/articles/10907941-instagram-s-vertical-grid","n":"Terceiros. Diz que a grade mostra o 4:5 e que o 1:1 pode ser cortado nas bordas."},{"t":"Adnova, zonas seguras dos anúncios da Meta","u":"https://adnova.ai/blogs/meta-ad-safe-zones-guide","n":"Terceiros. Reels: 14% no topo, 35% embaixo e 6% nas laterais."},{"t":"CFP, Nota Técnica nº 01/2022: uso profissional das redes sociais","u":"https://site.cfp.org.br/wp-content/uploads/2022/06/SEI_CFP-0612475-Nota-Tecnica.pdf","n":"Não menciona humor, memes ou tendências (leitura por resumo)."},{"t":"CRP-MG, cartilha de publicidade profissional (abril de 2026)","u":"https://acervodigital.crp04.org.br/wp-content/uploads/tainacan-items/9483/81624/CRP-MG_Cartilha-Publicidade-profissional-abril-2026.pdf","n":"Define sensacionalismo e pede linguagem acessível, sem senso comum. É de outro conselho regional (MG)."}],"metricasNota":"Medidos do mesmo jeito nos dois: navegador com tela de 390 × 844 px. “Itens clicáveis” são links, botões, campos e resumos que abrem e fecham.","metricas":[{"t":"Tela mais longa","antes":"97 telas","depois":"8 telas (Revisão UI/UX)"},{"t":"Primeiro botão de copiar","antes":"a 6.933 px do topo","depois":"visível ao abrir"},{"t":"Itens clicáveis com menos de 44 px","antes":"142 de 175","depois":"0 de 3.350 (em 120 telas, com abas e gavetas abertas)"},{"t":"Elementos com letra abaixo de 13 px","antes":"116","depois":"0 (sem contar o texto desenhado nas capas de exemplo, que são imagens em miniatura)"},{"t":"Tabelas que rolam para o lado","antes":"4 de 25","depois":"0, viram cartões"},{"t":"Instalar como app","antes":"não instalava","depois":"instala e abre sem internet"}],"limites":"Esta revisão mede o que dá para medir (tamanhos, contraste, contagens) e aponta o que depende de decisão da Letícia. Não houve teste com pessoas. Os números de “antes” vêm do HTML original aberto num navegador com tela de 390 × 844 px; os de “depois”, do app aberto do mesmo jeito. Os percentuais da zona segura, o limite do campo Nome e o comportamento da grade vêm de sites de terceiros e não foram confirmados na documentação oficial do Instagram. A nota técnica do CFP e a cartilha do CRP-MG foram lidas por uma ferramenta que resume páginas: a confiança de que humor, memes e tendências não aparecem nelas é média-alta. A cartilha é de outro conselho regional; a Letícia é do CRP 14 (MS). A divisão entre o perfil do Jean e o da Letícia, e o uso da terceira pessoa no perfil do Jean, são uma interpretação do pedido."}}</script>
<script>
(function(){'use strict';
/* ===== util: DOM, texto, datas, copiar, avisos ===== */

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

function add(el, c) {
  if (c == null || c === false) return;

  el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
// h('div', {class:'x', onclick:fn}, filhos...) — só texto vira textContent; nada de innerHTML.

      if (v == null || v === false) continue;

      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;

}

  s.appendChild(u);

}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

/* ----- texto ----- */
function fold(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function words(s) { var m = String(s).match(/\S+/g); return m ? m.length : 0; }
function nf(n, d) {
  d = d == null ? 0 : d;

}
function brl(n) { return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
function chars(s) { return Array.from(String(s)).length; }

/* ----- datas (sempre ao meio-dia, para o horário de verão não virar o dia) ----- */
var DOW3 = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
var DOWL = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

function two(n) { return (n < 10 ? '0' : '') + n; }
function isoOf(d) { return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
function fromISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((fromISO(isoOf(a)).getTime() - fromISO(isoOf(b)).getTime()) / 864e5); }
function dm(d) { return two(d.getDate()) + '/' + two(d.getMonth() + 1); }

/* ----- copiar e avisar ----- */
function copyText(t) {
  return new Promise(function (resolve) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, t.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        resolve(!!ok);
      } catch (e) { resolve(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { resolve(true); }, fallback);
    } else { fallback(); }
  });
}
var toastTimer = 0;
function toast(msg, o) {
  var el = $('#toast');
  if (!el) return;
  clear(el);
  el.appendChild(h('span', { text: msg }));
  if (o && o.action) el.appendChild(h('button', { class: 'toast-btn', type: 'button', text: o.action, onclick: function () { el.classList.remove('on'); if (o.onAction) o.onAction(); } }));
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('on'); }, (o && o.ms) || 2600);
}

/* ----- texto rico: [n] vira link de fonte, URL vira link, \n vira quebra ----- */
var RICH_RE = /(https?:\/\/[^\s<>"')\]]*[^\s<>"')\].,;:!?])|\[(\d{1,2})\]/g;
function lines(s) {
  var f = document.createDocumentFragment();
  String(s).split('\n').forEach(function (line, i) {
    if (i) f.appendChild(document.createElement('br'));
    if (line) f.appendChild(document.createTextNode(line));
  });
  return f;
}
/* ----- texto que muda com o perfil: ⟦para a Letícia|para o Jean⟧ ----- */
var TPL_RE = /⟦([^|⟧]*)\|([^⟧]*)⟧/g;
function R(s) {
  if (s == null) return s;
  s = String(s);
  if (s.indexOf('⟦') < 0) return s;
  var jean = S.st.perfil === 'jean';
  return s.replace(TPL_RE, function (m, a, b) { return jean ? b : a; });
}
function rich(str) {
  var out = [], last = 0, m;
  str = R(str);
  RICH_RE.lastIndex = 0;
  while ((m = RICH_RE.exec(str))) {
    if (m.index > last) out.push(lines(str.slice(last, m.index)));
    if (m[1]) out.push(h('a', { class: 'ext', href: m[1], target: '_blank', rel: 'noopener noreferrer', text: m[1] }));
    else out.push(h('a', { class: 'cite', href: '#/fonte/' + m[2], 'aria-label': 'Fonte ' + m[2] }, h('span', { text: m[2] })));
    last = m.index + m[0].length;
  }
  if (last < str.length) out.push(lines(str.slice(last)));
  return out;
}
function P(text, cls) { return h('p', { class: 'rich' + (cls ? ' ' + cls : '') }, rich(text)); }

/* ----- contraste WCAG (para mostrar a razão de cada par de cores) ----- */
function lum(hex) {
  var n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
    v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

/* ===== estado salvo no aparelho (localStorage; nada sai daqui) ===== */
var S = (function () {
  var KEY = 'gl:v1', st = null, ok = true;
  function fresh() {
    return {
      v: 1, start: '2026-10-19', status: {}, done: {}, log: {}, theme: 'auto', calc: {}, filtros: {}, instalarFechado: false,
      perfil: null, // 'jean' | 'leticia' | null (ainda não escolheu)
      estilo: { voz: 'sobria', visual: 'sobrio', d: null, persp: 'aliada', escolhida: false, porPauta: {} }
    };
  }
  // Completa o que falta (versões antigas do app e backups antigos não tinham perfil nem estilo).
  function norm(o) {
    var f = fresh(), k;
    for (k in f) if (!(k in o)) o[k] = f[k];
    if (!o.estilo || typeof o.estilo !== 'object' || Array.isArray(o.estilo)) o.estilo = f.estilo;
    for (k in f.estilo) if (!(k in o.estilo)) o.estilo[k] = f.estilo[k];
    if (!o.estilo.porPauta || typeof o.estilo.porPauta !== 'object' || Array.isArray(o.estilo.porPauta)) o.estilo.porPauta = {};
    if (o.perfil !== 'jean' && o.perfil !== 'leticia') o.perfil = null;
    return o;
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); st = raw ? JSON.parse(raw) : fresh(); } catch (e) { st = fresh(); ok = false; }
    if (!st || typeof st !== 'object' || Array.isArray(st)) st = fresh();
    st = norm(st);
  }

  return {
    get st() { return st; },
    save: save,

    // Recomeçar apaga o andamento. O perfil e a voz escolhida são preferências do aparelho e ficam.
    reset: function () { var p = st.perfil, e = st.estilo; st = fresh(); st.perfil = p; st.estilo = e; save(); },

    importJSON: function (txt) {

})();

function now() { return window.__NOW__ ? new Date(window.__NOW__) : new Date(); }

}

/* ----- feriados nacionais (e pontos facultativos), para qualquer data de início ----- */
function easter(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), hh = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - hh - k) % 7, m = Math.floor((a + 11 * hh + 22 * l) / 451),
    mo = Math.floor((hh + l - 7 * m + 114) / 31), da = ((hh + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da, 12, 0, 0);
}
var HCACHE = {};
function holidays(y) {
  if (HCACHE[y]) return HCACHE[y];
  var m = {}, fx = [[1, 1, 'Confraternização Universal'], [4, 21, 'Tiradentes'], [5, 1, 'Dia do Trabalho'], [9, 7, 'Independência'],

  fx.forEach(function (x) { m[isoOf(new Date(y, x[0] - 1, x[1], 12))] = { n: x[2], k: 'feriado' }; });

var ABAS = {
  hoje: { l: 'Hoje', icon: 'hoje', href: '#/hoje' },
  posts: { l: 'Posts', icon: 'posts', href: '#/posts' },
  perfis: { l: 'Perfis', icon: 'perfis', href: '#/perfis' },
  visual: { l: 'Criar', icon: 'visual', href: '#/visual' },
  conversas: { l: 'Conversas', icon: 'chat', href: '#/conversas' },
  anuncios: { l: 'Anúncios', icon: 'anuncio', href: '#/anuncios' },
  medir: { l: 'Medir', icon: 'chart', href: '#/medir' },
  mais: { l: 'Mais', icon: 'mais', href: '#/mais' }
};
var ABAS_DE = {
  leticia: ['hoje', 'posts', 'visual', 'conversas', 'mais'],
  jean: ['hoje', 'perfis', 'anuncios', 'medir', 'mais']
};
function idsAbas() { return ABAS_DE[perfilAtual()]; }
function ehRaiz(id) { return idsAbas().indexOf(id) > -1; }
// Última aba “raiz” em que a pessoa esteve: as telas que não têm aba própria neste perfil voltam para lá.
function origemRaiz() { return NAV.origem && ehRaiz(NAV.origem) ? NAV.origem : null; }
function tabDe(id) { return ehRaiz(id) ? id : (origemRaiz() || 'mais'); }
// Cabeçalho de uma tela que mora na aba `id`. Quem não tem essa aba chega pela aba de onde veio (ou por Mais) e volta para lá.
function lugar(o, id, backHash, backLabel) {
  o.tab = tabDe(id);
  if (!ehRaiz(id)) {
    var r = origemRaiz();
    o.back = r ? ABAS[r].href : (backHash || '#/mais');
    o.backLabel = r ? ABAS[r].l : (backLabel || 'Mais');
  }
  return o;
}
// Telas de detalhe (tarefa, pauta): voltam para a aba de onde a pessoa veio; sem origem, para `padrao`.
function lugarOrigem(o, padrao) {
  var r = origemRaiz() || padrao;
  o.tab = r; o.back = ABAS[r].href; o.backLabel = ABAS[r].l;
  return o;
}
function renderTabs() {
  var nav = $('#tabs');
  clear(nav);
  // nome do app no menu lateral (só aparece em tela larga; no celular o nome fica no cabeçalho)
  nav.appendChild(h('div', { class: 'tabs-marca', 'aria-hidden': 'true' }, h('img', { src: 'icons/icon.svg', alt: '', width: '34', height: '34' }), h('span', { text: 'Divã' })));
  idsAbas().forEach(function (id) {
    var a = ABAS[id];
    var el = h('a', { href: a.href, 'data-tab': id }, h('span', { class: 'tab-i' }, ic(a.icon)), h('span', { class: 'tab-l', text: a.l }));
    if (NAV.tab === id) el.setAttribute('aria-current', 'page');
    nav.appendChild(el);
  });
}
function irParaHoje() { if (location.hash === '#/hoje' || !location.hash) render({}); else location.hash = '#/hoje'; }
// Depois de apagar o progresso ou restaurar um backup: refaz abas, botão, tema e busca, e volta para Hoje.

  aplicarTema();

/* ---------- folha (painel que sobe de baixo) ---------- */
var FOLHA = null;
function poucoMovimento() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function foco(el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
function folhaTecla(e) {
  if (!FOLHA) return;
  if (e.key === 'Escape' && !FOLHA.gate) { e.preventDefault(); fecharFolha(); return; }
  if (e.key !== 'Tab') return;
  var f = $$('button:not([disabled]), a[href], input:not([disabled]), [tabindex="0"]', FOLHA.el).filter(function (x) { return x.offsetParent !== null && x.tabIndex >= 0; });
  if (!f.length) return;
  var ativo = document.activeElement, i = f.indexOf(ativo);
  if (e.shiftKey && (i <= 0)) { e.preventDefault(); foco(f[f.length - 1]); }
  else if (!e.shiftKey && (i < 0 || i === f.length - 1)) { e.preventDefault(); foco(f[0]); }
}
// o: {titulo, sub, corpo, gate (não fecha sem escolher), onClose}
function abrirFolha(o) {
  fecharFolha(true);
  var volta = document.activeElement;
  var raiz = h('div', { class: 'folha-w', id: 'folha' });
  var fundo = h('div', { class: 'folha-fundo', onclick: function () { if (!o.gate) fecharFolha(); } });
  var titulo = h('h2', { class: 'folha-t', id: 'folha-t', tabindex: '-1', text: o.titulo });
  var painel = h('div', { class: 'folha vidro', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'folha-t' },
    h('span', { class: 'folha-aura a1', 'aria-hidden': 'true' }),
    h('span', { class: 'folha-aura a2', 'aria-hidden': 'true' }),
    h('div', { class: 'folha-alca', 'aria-hidden': 'true' }),
    o.gate ? null : h('button', { class: 'ib folha-x', type: 'button', 'aria-label': 'Fechar', onclick: function () { fecharFolha(); } }, ic('x')),
    titulo,
    o.sub ? h('p', { class: 'folha-s', text: o.sub }) : null,
    o.corpo);
  raiz.appendChild(fundo);
  raiz.appendChild(painel);
  document.body.appendChild(raiz);
  var app = $('#app');
  app.setAttribute('inert', '');
  app.setAttribute('aria-hidden', 'true');
  FOLHA = { el: raiz, volta: volta, onClose: o.onClose, gate: !!o.gate };
  document.addEventListener('keydown', folhaTecla, true);
  var abre = function () { raiz.classList.add('on'); };
  if (window.requestAnimationFrame && !poucoMovimento()) window.requestAnimationFrame(function () { window.requestAnimationFrame(abre); }); else abre();
  // Na primeira vez o foco vai para o título (lido pelo leitor de tela); sem anel de foco num botão que ninguém escolheu.
  var alvo = o.gate ? titulo : ($('[aria-pressed="true"]', painel) || $('[aria-checked="true"]', painel) || $('.vidro-op', painel) || titulo);
  setTimeout(function () { foco(alvo); }, 40);
}
function fecharFolha(rapido) {
  if (!FOLHA) return;
  var f = FOLHA;
  FOLHA = null;
  document.removeEventListener('keydown', folhaTecla, true);
  var app = $('#app');
  app.removeAttribute('inert');
  app.removeAttribute('aria-hidden');
  f.el.classList.remove('on');
  var fim = function () {
    if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
    var v = f.volta && document.body.contains(f.volta) ? f.volta : $('#pill');
    if (v && !f.gate) foco(v);
    if (f.onClose) f.onClose();
  };
  if (rapido || poucoMovimento()) fim(); else setTimeout(fim, 230);
}

/* ---------- chave de vidro: Jean | Letícia ---------- */
// cur: perfil atual (ou null); onPick(id) é chamado ao tocar.

      class: 'vidro-op', type: 'button', 'data-id': id, 'aria-pressed': String(id === cur),

function descPerfis() {

function notaPerfil() {
  return h('p', { class: 'folha-n' }, ic('info'), h('span', { text: 'Isto não é senha: só muda o que aparece. O endereço do app é aberto para quem o tiver, então não coloque dado de paciente aqui.' }));
}

/* ---------- aplicar a escolha ---------- */
function aplicaPerfil(id) {
  S.st.perfil = id;
  S.save();
  IDX = null; // o índice da busca guarda o texto já ajustado ao perfil
  renderTabs();
  pintaPill();
}
function abrirTrocaPerfil() {
  var corpo = [
    chavePerfil(S.st.perfil, function (id) {
      var mudou = id !== S.st.perfil;
      if (!mudou) { setTimeout(function () { fecharFolha(); }, poucoMovimento() ? 0 : 280); return; }
      aplicaPerfil(id);
      setTimeout(function () {
        fecharFolha(true);
        toast('Perfil ' + C.papeis[id].nome + '.');
        irParaHoje();
      }, poucoMovimento() ? 0 : 420);
    }),
    descPerfis(), notaPerfil()
  ];
  abrirFolha({ titulo: 'Quem está usando?', sub: 'Escolha o perfil. Dá para trocar a qualquer hora.', corpo: corpo });
}
// Primeira vez neste aparelho (ou depois de apagar o progresso): a folha não fecha sem escolha.
function abrirGate() {
  var corpo = [
    chavePerfil(null, function (id) {
      aplicaPerfil(id);
      setTimeout(function () {
        if (FOLHA) FOLHA.gate = false;
        fecharFolha(true);
        render({ initial: true });
        toast('Perfil ' + C.papeis[id].nome + '. Para trocar, toque no botão de vidro lá em cima.', { ms: 4200 });
      }, poucoMovimento() ? 0 : 420);
    }),
    descPerfis(), notaPerfil()
  ];
  abrirFolha({ titulo: 'Quem está usando?', sub: 'Escolha o perfil para começar.', corpo: corpo, gate: true });
}
function garantePerfil() { if (!S.st.perfil && !FOLHA) abrirGate(); }

/* ===== voz dos posts e visual das capas: montam os prompts =====
   Regra de ouro: com a voz Sóbria, os ajustes de fábrica e o visual Sóbrio, o prompt é IGUAL ao do arquivo original.
   Qualquer outra escolha só ACRESCENTA um parágrafo (voz) ou TROCA o parágrafo de visual; os limites éticos do prompt ficam. */
var VOZ = {};
C.vozes.forEach(function (v) { VOZ[v.id] = v; });
var DIAL = C.dials;

function vozGlobal() { return VOZ[S.st.estilo.voz] ? S.st.estilo.voz : 'sobria'; }
// voz de uma pauta: a escolhida só para ela, ou a geral
function vozId(p) {
  var o = S.st.estilo.porPauta;
  return (p && o && VOZ[o[p.id]]) ? o[p.id] : vozGlobal();
}
function umDial(n) { n = Math.round(Number(n)); return n >= 0 && n <= 2 ? n : 0; }
function dialsPadrao(id) { var d = VOZ[id].d; return { h: d[0], i: d[1], p: d[2] }; }
function dialsDe(p) {
  var id = vozId(p), d = S.st.estilo.d;
  if (id !== vozGlobal() || !d || typeof d !== 'object') return dialsPadrao(id);
  return { h: umDial(d.h), i: umDial(d.i), p: umDial(d.p) };
}
function perspId() { return S.st.estilo.persp === 'comunidade' ? 'comunidade' : 'aliada'; }
function perspDe(id) { return C.persp.filter(function (x) { return x.id === id; })[0]; }
function vozPadrao(p) {
  var d = dialsDe(p);
  return vozId(p) === 'sobria' && !d.h && !d.i && !d.p && perspId() === 'aliada';
}
// há humor, gíria ou referência de internet em jogo?
function tomLeve(p) { var d = dialsDe(p); return vozId(p) !== 'sobria' || d.h > 0 || d.i > 0; }

// Pauta que fala de violência, risco ou ambiente inseguro, com humor, gíria ou internet em jogo: o prompt volta ao tom sóbrio.
function sensivelLeve(p) { return !!(p && C.vozCuidado[p.id]) && tomLeve(p); }
function vozUsada(p) { return sensivelLeve(p) ? 'sobria' : vozId(p); }

function vozBloco(p) {
  if (vozPadrao(p)) return '';
  var sens = sensivelLeve(p), V = VOZ[vozUsada(p)], d = dialsDe(p), out = [];
  if (sens) d = { h: 0, i: 0, p: d.p }; // sem o bloco da voz leve e sem humor nem internet; só “quem fala” e a perspectiva seguem a escolha
  if (V.bloco) out.push(V.bloco);
  out.push(DIAL[0].o[d.h].ia, DIAL[1].o[d.i].ia, DIAL[2].o[d.p].ia, perspDe(perspId()).ia);
  if (tomLeve(p)) out.push(C.vozGuarda);
  if (sens) out.push('Esta pauta toca ' + C.vozCuidado[p.id] + ': use tom sóbrio, sem humor, gírias ou referências de internet.');
  return out.join(' ');
}
function rotuloVoz(p) {
  var id = vozUsada(p);
  return 'Voz desta peça, ' + VOZ[id].nome + (id === 'sobria' ? (sensivelLeve(p) ? ' (pauta sensível)' : ' (com ajustes)') : '') + ': ';
}

/* ---------- visual ---------- */
function skinAtual() { return C.skins[S.st.estilo.visual] ? S.st.estilo.visual : 'sobrio'; }
function skin() { return C.skins[skinAtual()]; }
function modelo(id) { return skin().models[id]; }
function visualLabel(p) { var m = postModel(p); return m ? skin().label[m] : p.visual; }

/* ---------- prompts ---------- */
// Devolve o prompt em pedaços; inj:true marca o que o app acrescentou ou trocou (a tela destaca esses trechos).
function promptPartes(p) {
  var t = p.prompt, F = C.prompt.fraseVoz, segs = [], bloco = vozBloco(p), i, j;
  if (bloco) { i = t.indexOf(F); if (i > -1) segs.push([i + F.length, i + F.length, ' ' + rotuloVoz(p) + bloco]); }
  if (skinAtual() === 'pop') {
    var orig = 'Direção visual: ' + p.visual + '. ' + C.prompt.visHead + C.prompt.visTailSobrio;
    j = t.indexOf(orig);
    if (j > -1) segs.push([j, j + orig.length, 'Direção visual: ' + visualLabel(p) + '. ' + C.prompt.visHead + C.skins.pop.promptTail]);
  }
  segs.sort(function (a, b) { return a[0] - b[0]; });
  var partes = [], pos = 0;
  segs.forEach(function (s) {
    if (s[0] > pos) partes.push({ t: t.slice(pos, s[0]) });
    partes.push({ t: s[2], inj: true });
    pos = s[1];
  });
  partes.push({ t: t.slice(pos) });
  return partes;
}
function promptDe(p) { return promptPartes(p).map(function (x) { return x.t; }).join(''); }

function vozRevisao() {
  if (vozPadrao(null)) return '';
  var V = VOZ[vozGlobal()], d = dialsDe(null);
  return ' Confira também se o tom segue a voz escolhida (' + V.nome + '; humor: ' + DIAL[0].o[d.h].r.toLowerCase() + '; internet: ' + DIAL[1].o[d.i].r.toLowerCase() +
    '; quem fala: ' + DIAL[2].o[d.p].r.toLowerCase() + '). Corte qualquer humor, gíria ou referência de internet que sirva só para parecer atual, que dependa de contexto para ser entendida ou que possa ferir.';
}
// Os 3 prompts de apoio: 0 revisar, 1 Canva, 2 nova ideia
function auxDe(i) {
  var t = C.auxPrompts[i].text;
  if (i === 0) t += vozRevisao();
  else if (i === 1 && skinAtual() === 'pop') {
    var k = t.indexOf(C.prompt.canvaSobrio);
    if (k > -1) t = t.slice(0, k) + C.skins.pop.canva + t.slice(k + C.prompt.canvaSobrio.length);
  } else if (i === 2) {
    var b = vozBloco(null);
    if (b) t += ' ' + rotuloVoz(null) + b;
  }
  return t;
}
function auxMudou(i) { return auxDe(i) !== C.auxPrompts[i].text; }

/* ---------- reescrever uma peça pronta (P01 a P03) numa voz nova ---------- */
function pecaTexto(id) {
  var ch = CH['prontos' + Number(id.slice(1))], out = [];
  var tb = ch.blocks.filter(function (b) { return b.t === 'table'; })[0];
  if (fold(tb.head[0]) === 'slide') {
    out.push('SLIDES');
    tb.rows.forEach(function (r) { out.push('Slide ' + r[0] + ': ' + r[1]); });
  } else {
    out.push('ROTEIRO');
    tb.rows.forEach(function (r) { out.push(r[0] + ' | Fala: ' + r[1] + ' | Na tela: ' + r[2]); });
  }
  var cps = ch.blocks.filter(function (b) { return b.t === 'copy'; });
  if (cps[0]) out.push('', 'LEGENDA', cps[0].text);
  var st = listAfter(ch.id, 'Stories prontos');
  if (st.length) { out.push('', 'STORIES'); st.forEach(function (s, i) { out.push('Tela ' + (i + 1) + ': ' + storyText(s)); }); }
  return out.join('\n');
}
function reescreverPrompt(id) {
  var p = BYID[id], b = vozBloco(p);
  if (!b) return '';
  return C.vozReescrever.intro + '\n\n' + rotuloVoz(p) + b + '\n\n' + C.vozReescrever.regras + '\n\nPEÇA ATUAL\n' + pecaTexto(id);
}

/* ===== componentes visuais ===== */

function btn(label, o) {
  o = o || {};
  var cls = 'btn btn-' + (o.kind || 'sec') + (o.block ? ' btn-block' : '');
  var kids = [o.icon ? ic(o.icon) : null, h('span', { text: R(label) })];
  if (o.href) {
    var a = h('a', { class: cls, href: o.href }, kids);
    if (o.ext) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }
    return a;
  }
  return h('button', { class: cls, type: 'button', onclick: o.onclick, 'aria-pressed': o.pressed == null ? null : String(o.pressed) }, kids);
}

// Botão que copia. `get` é um texto ou uma função que devolve o texto.
function copyBtn(get, o) {
  o = o || {};
  var label = o.label || 'Copiar', done = o.done || 'Copiado';
  var kind = o.kind === 'primary' ? 'btn btn-primary' : (o.kind === 'sec' ? 'btn btn-sec' : 'btn btn-copy');
  var b = h('button', { class: kind + (o.block ? ' btn-block' : ''), type: 'button' }, ic('copy'), h('span', { class: 'lbl', text: label }));
  var timer = 0;
  b.addEventListener('click', function () {
    var text = typeof get === 'function' ? get() : get;
    copyText(text).then(function (ok) {
      var span = $('.lbl', b), use = $('use', b);
      clearTimeout(timer);
      if (ok) {
        b.classList.add('ok'); span.textContent = done; use.setAttribute('href', '#i-check');
        toast(o.msg || 'Copiado. Agora é só colar.');
        timer = setTimeout(function () { b.classList.remove('ok'); span.textContent = label; use.setAttribute('href', '#i-copy'); }, 2200);
      } else {
        toast('Não consegui copiar. Toque e segure no texto para copiar à mão.', { ms: 4200 });
      }
    });
  });
  return b;
}

function chip(text, cls, icon) { return h('span', { class: 'chip' + (cls ? ' ' + cls : '') }, icon ? ic(icon) : null, R(text)); }
// short: rótulo curto para listas (“Processo” em vez de “Interseção e processo”)
function audChip(p, short) {
  var a = AUD[p.audience], s = a ? a.short : '';
  return chip(a ? (short ? s.charAt(0).toUpperCase() + s.slice(1) : a.label) : p.audience, a ? a.cls : '');
}
function fmtChip(p) { return chip(p.format, 'c-neutro', p.format === 'Reel' ? 'play' : 'carousel'); }
function stagePill(id) { var s = STBYID[id]; return h('span', { class: 'etapa e-' + id }, ic(s.icon), s.label); }

function diaTile(d, o) {
  o = o || {};
  var t = today();
  return h('div', { class: 'dia' + (o.grande ? ' dia-g' : '') + (daysBetween(d, t) === 0 ? ' hoje' : ''), 'aria-hidden': 'true' },
    h('span', { class: 'dia-m', text: MES3[d.getMonth()] }),
    h('span', { class: 'dia-d', text: String(d.getDate()) }),
    h('span', { class: 'dia-w', text: DOW3[d.getDay()] }));
}

// Texto pronto para copiar (balão). o: {label, text, max, unit, nota, plain}
function balao(o) {
  o = Object.assign({}, o, { text: R(o.text) }); // marcas do modelo resolvidas antes: o que aparece é o que é contado e copiado
  var n = o.unit === 'palavras' ? words(o.text) : chars(o.text);
  var unit = o.unit || 'caracteres';
  var over = o.max && n > o.max;
  var txt = h('div', { class: 'balao-txt' });
  if (o.plain) txt.appendChild(lines(o.text)); else add(txt, rich(o.text));
  var cnt = h('span', { class: 'cnt' + (over ? ' over' : '') }, nf(n) + (o.max ? ' de ' + nf(o.max) : '') + ' ' + unit);
  var longo = String(o.text).length > 420; // texto longo: o botão de copiar ocupa a largura toda, fácil de acertar com o polegar
  return h('div', { class: 'balao' + (longo ? ' balao-longo' : ''), role: 'group', 'aria-label': R(o.label) || 'Texto pronto' },
    o.label ? h('p', { class: 'balao-t', text: R(o.label) }) : null,
    txt,
    h('div', { class: 'balao-pe' }, o.nocount ? h('span') : cnt, copyBtn(o.text, { msg: o.msg, block: longo })),
    o.nota ? h('p', { class: 'balao-n' }, rich(o.nota)) : null);

// Renderiza os blocos de um capítulo do guia (conteúdo original, só com outra aparência).
function renderChapter(ch) {
  var out = [], lastH3 = '', copyIdx = 0;
  var notes = (C.chapterNotes && C.chapterNotes[ch.id]) || [];
  notes.forEach(function (n) { out.push(nota(n.kind || 'alerta', P(n.text), n.title)); });
  ch.blocks.forEach(function (b) {
    switch (b.t) {
      case 'h3': lastH3 = b.text; out.push(h('h3', { class: 'sec-t2', text: b.text })); break;
      case 'p': out.push(P(fixT(b.text))); break;
      case 'ul':
        if (/stories/i.test(lastH3)) {
          // cada tela dos Stories vira um balão pronto para copiar
          var sb = h('div');
          b.items.forEach(function (s, i) { sb.appendChild(balao({ label: 'Tela ' + (i + 1), text: storyText(s), nocount: true })); });
          out.push(sb);
        } else out.push(pontos(b.items.map(fixT)));
        break;
      case 'table': out.push(renderTable(b)); break;
      case 'note': out.push(nota(/^Limite da IA/.test(b.text) ? 'alerta' : 'info', P(b.text))); break;
      case 'copy': {
        var key = ch.id + ':' + copyIdx++, lim = (C.limits || {})[key] || {};
        out.push(balao({ label: (C.copyLabels || {})[key] || lastH3 || 'Texto pronto', text: b.text, max: lim.max, plain: /^https?:\/\//.test(b.text) }));

      case 'mocks': {

        ['a', 'b', 'c'].forEach(function (k) { tira.appendChild(capa(k)); });

        break;
      }
      case 'source': out.push(fonteCard(b)); break;
      case 'endnote': out.push(P(b.text, 'muted pequeno')); break;
    }
  });
  if (ch.id === 'calendario') out.push(h('div', { class: 'acoes' }, btn('Abrir o calendário das 24 pautas', { href: '#/posts', kind: 'primary', icon: 'posts' })));

/* ---------- grupos de escolha (rádio) ---------- */
// Setas movem a escolha dentro do grupo; só o item marcado entra na ordem do Tab.
function setasRadio(box) {
  box.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k !== 'ArrowDown' && k !== 'ArrowRight' && k !== 'ArrowUp' && k !== 'ArrowLeft') return;
    var l = $$('[role="radio"]', box), i = l.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    var j = (i + (k === 'ArrowDown' || k === 'ArrowRight' ? 1 : l.length - 1)) % l.length;
    l[j].focus();
    l[j].click();
  });
}
function pintaRadio(box, valor) {
  $$('[role="radio"]', box).forEach(function (b) {
    var on = b.dataset.id === valor;
    b.setAttribute('aria-checked', String(on));
    b.tabIndex = on ? 0 : -1;
  });
}
// Cartão de escolha. v: {id, nome, resumo, ex?, quando?}
function vozOpcao(v, sel, onPick) {
  var b = h('button', { class: 'vozc', type: 'button', role: 'radio', 'data-id': v.id, 'aria-checked': String(!!sel), tabindex: sel ? '0' : '-1' },
    h('span', { class: 'vozc-top' }, h('strong', { class: 'vozc-n', text: v.nome }), h('span', { class: 'vozc-ok', 'aria-hidden': 'true' }, ic('check'))),
    v.resumo ? h('span', { class: 'vozc-r', text: R(v.resumo) }) : null,
    v.ex ? h('span', { class: 'vozc-ex' }, h('i', { text: 'Exemplo' }), '“' + v.ex + '”') : null,
    v.quando ? h('span', { class: 'vozc-q', text: 'Combina com: ' + v.quando }) : null);
  b.addEventListener('click', function () { onPick(v.id); });
  return b;
}

    root.appendChild(h('div', { class: 'acoes' }, btn('Instalar agora', { kind: 'primary', icon: 'download', block: true, onclick: function () { deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; }); } })));
  }
  function passosIos() {
    return passos([

      h('div', null, P('Escolha Adicionar à Tela de Início.'), h('div', { class: 'icone-ex' }, ic('plus-square'), h('span', { text: 'Role a lista se não achar.' }))),
      P('Se aparecer a opção “Abrir como app da web”, deixe ligada.'),

    ]);
  }
  function passosAnd() {

      h('div', null, P('Abra este endereço no Chrome.')),
      h('div', null, P('Toque nos três pontinhos no canto.'), h('div', { class: 'icone-ex' }, ic('dots-v'), h('span', { text: 'Menu do Chrome.' }))),
      P('Toque em Instalar app. Em alguns celulares o texto é Adicionar à tela inicial.'),
